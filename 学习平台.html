"s4_3": `// Flink 实时计算：水位线 + 窗口 + 状态（Java，面试手撕最常见的一条链路）
public class WindowWordCount {
    public static void main(String[] args) throws Exception {
        StreamExecutionEnvironment env = StreamExecutionEnvironment.getExecutionEnvironment();
        env.setParallelism(4);

        // ① 开启 Checkpoint：Exactly-Once 的地基
        env.enableCheckpointing(60_000);                       // 每 60s 一次
        env.getCheckpointConfig().setCheckpointingMode(CheckpointingMode.EXACTLY_ONCE);
        env.getCheckpointConfig().setMinPauseBetweenCheckpoints(30_000);
        env.setStateBackend(new HashMapStateBackend());
        env.getCheckpointConfig().setCheckpointStorage("hdfs://ck/order");

        // ② 事件时间 + 水位线：允许 5 秒乱序
        WatermarkStrategy<Order> wm = WatermarkStrategy
            .<Order>forBoundedOutOfOrderness(Duration.ofSeconds(5))
            .withTimestampAssigner((o, ts) -> o.getEventTime())
            .withIdleness(Duration.ofMinutes(1));             // 空闲 source 标记 idle，防水位线不涨

        env.addSource(new FlinkKafkaConsumer<>("order", new OrderSchema(), props))
           .assignTimestampsAndWatermarks(wm)
           .keyBy(Order::getCity)                             // ③ 先 keyBy 才能开窗口
           .window(TumblingEventTimeWindows.of(Time.minutes(5)))  // ④ 滚动窗口 5 分钟
           .allowedLateness(Time.minutes(1))                  // ⑤ 允许迟到 1 分钟，会触发增量更新
           .sideOutputLateData(lateTag)                       // ⑥ 超过的进侧输出流，别丢
           .aggregate(new OrderAgg())                         // ⑦ 增量聚合（比 process 全量存省内存）
           .addSink(new KafkaSink<>());

        env.execute("city-gmv-5min");
    }
}

/* 四个必背要点：
   1. 窗口触发条件：水位线 >= 窗口结束时间。所以"窗口不输出"第一查水位线有没有涨。
   2. 滚动 vs 滑动：滚动 = 固定不重叠（每 5 分钟 GMV）；滑动 = 有重叠（每 1 分钟看近 5 分钟）。
   3. 会话窗口（Session Window）：按 gap 切分，适合"用户一次访问"这类不固定长度的行为。
   4. Exactly-Once 三前提：source 可重放（Kafka） + 状态可快照（Checkpoint） + sink 幂等或支持 2PC。
   任何一个不满足，"Exactly-Once" 就是自欺欺人。 */

"s4_8": `# 数据安全与合规：脱敏 + 分级 + 审计（三件套，缺一件都不叫落地）
import hashlib, re, pandas as pd

# ---------- 1. 脱敏：目标是"可用但不可反推" ----------
def mask_phone(p: str) -> str:
    """展示用：中间四位打星"""
    return re.sub(r"(\\d{3})\\d{4}(\\d{4})", r"\\1****\\2", str(p))

def salt_hash(p: str, salt: str) -> str:
    """关联用：加盐哈希，同手机号始终得同一结果，可 JOIN 但不可反推
       注意：纯 MD5/SHA256 对手机号这种小空间可被彩虹表暴力枚举 —— 加盐是必须的"""
    return hashlib.sha256((str(p) + salt).encode()).hexdigest()[:16]

df = pd.DataFrame({"phone": ["13812345678", "13900001111"], "amount": [99.0, 158.0]})
df["phone_mask"] = df.phone.map(mask_phone)                 # 给业务看
df["phone_hash"] = df.phone.map(lambda x: salt_hash(x, SALT))  # 给关联用
df = df.drop(columns=["phone"])                             # 明文不入下游表

# 常见坑：只脱敏"展示层"，底层表还是明文 —— 那不叫脱敏，那叫掩耳盗铃
# 正确做法：在 ODS → DWD 这一步就脱敏，下游拿到的永远是脱敏后的数据

# ---------- 2. 分级：没有分级就没有管控 ----------
# | 级别 | 判定 | 例子 | 管控 |
# |---|---|---|---|
# | L1 公开 | 可对外 | 商品类目、地区字典 | 全放开 |
# | L2 内部 | 内部流转 | 订单汇总、GMV | 登录可见 |
# | L3 敏感 | 关联到个人 | 手机号、收货地址 | 脱敏 + 申请审批 |
# | L4 核心 | 泄露后果严重 | 身份证、支付信息 | 加密存储 + 最小权限 + 全审计 |

# ---------- 3. 权限与审计 SQL（MySQL 示例） ----------
# -- 最小权限原则：按角色授权，不给人授权
# CREATE ROLE analyst;

# -- 敏感明细不给 analyst，给单独角色且需审批：

# GRANT SELECT ON dw.dwd_user_pii TO pii_reader;
# -- 审计：谁在什么时候查了敏感表，必须留痕（出事要能溯源）

  const ANS_EXTRA3 = {

"s2_7": [`<span class="q-follow"><b>🔗 追问预演：</b>面试官会追问「DataWorks 挂了你怎么排查」——答：先看节点运行日志（不是只盯着"失败"两个字），再按三层排查：① 资源（CU 配额是否被打满）② 依赖（上游分区是否产出）③ 数据（源表是否有当天分区）。<b>加分句：我给核心表配了基线告警，超时没产出会直接告警到钉钉，不用等人发现。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「云上和自建 Hadoop 你更愿意用哪个」——别说"云上方便"这种废话。答：<b>自建适合练原理（你能亲手配 HDFS、调 YARN、看 shuffle），云上适合做交付（省运维、弹性、按量付费）</b>。学生阶段先自建把原理打穿，做项目时用云把交付跑通，两者都讲得出差异才是真的懂。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会问「云上怎么控制成本」——三条：① 查询必须带分区条件，禁止 SELECT *（云上按扫描量计费，一次全表扫描可能就是几十块）② 按层设生命周期（ODS 30 天 / DWD 90 天 / DWS 永久）③ 先按量付费跑一周看账单再决定规格。<b>能主动聊成本的应届生很少，这是廉价加分项。</b></span>`],

"s0_2": [`<span class="q-follow"><b>🔗 追问预演：</b>面试官会顺着问「rows 和 filtered 什么意思」——rows 是<b>预估扫描行数</b>（优化器基于统计信息算的，可能不准），filtered 是<b>预估过滤后剩余比例</b>。真正的行数要看 <b>EXPLAIN ANALYZE</b>（实际执行）。补充一句"rows 是估算、可能因为统计信息过期而偏差很大"，会让面试官觉得你看过真东西。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「除了函数，还有什么会让索引失效」——四条：① 隐式类型转换（字符串列传数字）② 前导模糊查询 LIKE '%abc' ③ 联合索引不满足最左前缀 ④ 优化器判断回表代价太高，干脆全表扫描。<b>金句：索引失效的本质是"B+ 树的有序性用不上了"。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会问「Using temporary 和 Using filesort 哪个更严重」——两者都不是真的写磁盘（名字有误导性），但都意味着额外开销。<b>Using temporary 通常更重</b>（要建临时表）。优化方向：给 ORDER BY / GROUP BY 的字段建符合最左前缀的联合索引，让排序直接走索引顺序。</span>`],

"s2_4": [`<span class="q-follow"><b>🔗 追问预演：</b>会追问「切分大小你怎么定的，为什么是 400 字」——<b>不要拍脑袋</b>，要说做过对比：固定三组（200/400/800）跑评估集，看 Recall@5 和答案完整度，选拐点。并说明代价：切太小语义断裂、切太大噪声多且贵。<b>能讲出"我用评估集选的参数"比报一个数字强十倍。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会追问「光看召回率够吗」——不够。召回高只说明"找得到"，不说明"答得对"。至少再加两个：<b>拒答率</b>（知识库里没有的问题，是不是硬编了答案——这是 RAG 最致命的翻车点）和<b>引用准确率</b>（给的答案是否真的来自检索到的片段）。三者一起看才叫评估。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会追问「文档更新了旧内容怎么办」——这是时效性问题，也是面试官最爱挖的点。答：① 每条 chunk 带版本号和更新时间元数据，检索后按时间过滤或降权 ② 更新时先删旧 chunk 再插新的（同一 doc_id 覆盖）③ 定期跑一遍评估集，监控召回是否漂移。<b>说得出"删除不是可选而是必须"，说明你真维护过。</b></span>`],

"s1_5": [`<span class="q-follow"><b>🔗 追问预演：</b>会问「列存有什么代价」——答：单行写入慢（要写多个列文件）、点查慢（要跨多个列文件拼一行）、UPDATE/DELETE 不友好（很多引擎靠标记删除 + 后台合并）。<b>所以 OLAP 引擎是给"一次写入、多次聚合扫描"设计的，不是用来替代 MySQL 的。</b>能主动说出代价，比只夸优点可信得多。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会追问「除了换引擎还有什么办法」——先别急着换引擎，答三层：① SQL 层改为先 group by 去重再 count（两阶段聚合）② 用近似算法（HyperLogLog，误差约 1%，省几十倍资源）③ 预聚合到 DWS 层。<b>先优化再换组件，是工程判断力；上来就说"用 ClickHouse"，是背八股。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「Doris 和 ClickHouse 怎么选」——别背参数，讲场景：<b>Doris/StarRocks</b> 兼容 MySQL 协议、支持高并发点查和实时 Upsert，适合做统一查询入口；<b>ClickHouse</b> 单表聚合极快、适合海量日志分析，但 JOIN 和高并发点查弱。金句：<b>选引擎看的是你的查询模式（点查多还是扫描多、要不要实时更新），不是看谁跑分高。</b></span>`],

"s0_7": [`<span class="q-follow"><b>🔗 追问预演：</b>会追问「查到 PID 之后呢」——别卡在这。答：先看 <b>ps -fp PID</b> 确认是不是自己的进程；确认要杀就用 <b>kill -15</b>（优雅退出，让进程自己收尾），别上来就 <b>kill -9</b>（强制杀，可能留下脏状态）。<b>数据岗用 kill -9 的任务，八成会留下一堆没清理的临时文件。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会问「tail -f 和 tail -F 有什么区别」——<b>-F = -f + retry</b>：日志被切割（logrotate）后，-f 会停在新旧文件交替处不动，-F 会重新打开新文件继续跟。<b>线上排查用 -F</b>。再补一句常用组合：<b>grep 'ERROR' app.log | tail -20</b> 快速看最近的错误。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会追问「crontab 里脚本为什么不执行」——这是真实高频坑，答三条：① crontab 的<b>环境变量极简</b>（没有 PATH、没有 JAVA_HOME），脚本里要用绝对路径或显式 source /etc/profile ② 输出被吞，要重定向 <b>>> /tmp/x.log 2>&1</b> 才看得见报错 ③ 末尾要有空行、脚本要有执行权限。<b>能说出"环境变量"这一条，说明你真被坑过。</b></span>`],

"s4_2": [`<span class="q-follow"><b>🔗 追问预演：</b>会追问「acks=all 就一定不丢吗」——不一定。还要看 <b>min.insync.replicas</b>：如果它是 1，ISR 里只剩 leader 也能写入，leader 一挂照样丢。<b>真正的不丢 = acks=all + 副本数 ≥3 + min.insync.replicas ≥2。</b>能补上这个参数，说明你读的是生产文档不是面经。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「怎么减少 rebalance」——答：① 用<b>协作式重平衡（Cooperative Rebalance）</b>，只迁移必要的分区，不再全组 stop-the-world ② 调大 session.timeout.ms 和 max.poll.interval.ms，避免处理慢被误判离线 ③ 消费者逻辑里别做重活，先把消息拉下来异步处理。<b>根因通常不是 Kafka 慢，是消费逻辑里有慢 IO。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会追问「重复数据你怎么在业务侧去重」——给具体方案：① 数据库唯一索引（最省事，天然幂等）② Redis setnx 带过期时间（高并发场景）③ 用 (user_id, order_id, event_time) 做业务主键，写入前先查。<b>金句：幂等的本质是找到一个"天然唯一键"，而不是加一堆 if 判断。</b></span>`],

"s1_4": [`<span class="q-follow"><b>🔗 追问预演：</b>会追问「输出分区已经写了一半失败了怎么办」——这是幂等最关键的细节。答：<b>别直接往目标分区写</b>，先写临时目录 / 临时表，写成功后原子 rename / 换分区；失败就删临时目录重跑，目标分区始终要么是旧值、要么是新值，不会是"半份"。<b>直接 INSERT OVERWRITE 到正在被读的分区，是生产事故的经典起手式。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会问「任务 A 跑完了但数据不对，下游怎么知道的」——引出<b>数据质量卡点</b>：任务结束前跑校验（行数波动、主键唯一、空值率），校验失败就让任务失败，而不是让脏数据流下去。<b>静默的错误数据比任务失败可怕一百倍</b>——失败会告警，脏数据会一直被当成对的用。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「增量同步的边界怎么处理」——三个真实坑：① 用时间戳做增量会漏掉<b>跨边界的迟到数据</b>（23:59 下单、00:01 落库）② 物理删除的数据同步不到（要用 binlog 或软删标记）③ 上游重跑历史分区，下游不会感知。<b>答出"迟到数据"这一条，基本能过这关。</b></span>`],

"s0_5": [`<span class="q-follow"><b>🔗 追问预演：</b>会追问「groupby 之后还能直接取别的列吗」——答：聚合后只剩<b>分组键 + 聚合结果</b>，其他列要么丢、要么也要聚合。想保留多列用 <b>agg({'销售额':'sum','订单数':'count'})</b>。<b>新手最常见的错误是 groupby 后直接取一列，发现"列不见了"。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会问「merge 后行数变多了是怎么回事」——这是面试高频。原因：on 的键在右表有重复 → 一对多展开。排查：<b>先检查右表键是否唯一</b>（df2.key.duplicated().sum()），合并时指定 <b>validate='one_to_one'</b> 让 pandas 直接报错。<b>金句：merge 后行数变化是数据 bug 的第一信号，永远要核对。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「缺失值该删还是该填」——没有标准答案，看成因：① 随机缺失、占比小 → 删 ② 有业务含义（如"未填写年龄"）→ 单独成一类 ③ 时间序列 → 前向填充 ④ 数值型且缺失多 → 用中位数（不是均值，抗极值）。<b>关键动作：先统计每列缺失率，再决定，别一把 dropna() 梭哈。</b></span>`],

"s0_6": [`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「除了 UA，403 还可能因为什么」——① 需要登录态（带 Cookie / Token）② 接口有签名或 Referer 校验 ③ IP 被限流（429 也常被误判成 403）④ 频率太高被风控。<b>排查顺序：先用浏览器/Postman 手动请求一次，确认是接口本身拒绝还是你的请求构造有问题</b>，再改代码。</span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会问「拿到响应怎么保证数据没被截断」——三步：① 检查 <b>resp.status_code == 200</b> ② 检查 <b>Content-Type</b> 是不是真的 JSON（很多错误页返回 200 但内容是 HTML）③ 用 <b>try/except</b> 包住 resp.json() 并打印 <b>resp.text[:200]</b>。<b>金句：状态码 200 不代表你拿到了想要的数据。</b></span>`,
`<span class="q-follow"><b>🔗 追问预演：</b>会被追问「CSV 里的逗号、换行、中文乱码怎么一起解决」——① 中文乱码：写文件时用 <b>encoding='utf-8-sig'</b>（带 BOM，Excel 直接打开不乱码）② 逗号/换行：pandas 的 to_csv 会自动加引号，别自己拼字符串 ③ 数值被 Excel 科学计数：把长 ID 列转成字符串。<b>补充：生产环境更推荐落 Parquet，保留类型、体积小、不会乱码。</b></span>`],

"s0_2": [["场景：一条 SQL 上线前跑 0.2 秒，上线后跑了 20 秒。你怎么从 0 到 1 排查？",

"s2_7": ["<b>云上和自建的核心心智差异</b>：自建你拥有集群（要自己管资源、扩容、修故障）；云上你<b>租用算力</b>（按量付费、弹性伸缩、不用管机器）。对应的行为差异：云上必须关心<b>成本</b>（扫描量、存储、CU 时长），自建更关心<b>容量</b>。面试讲云项目时，能说出账单是多少、怎么优化的，是极强的加分项。",

<text x="360" y="156" text-anchor="middle" font-size="12" fill="#475569">④ 语义去重（embedding 余弦相似度）—— 越往后越慢，但能抓住"换个说法其实是同一段"</text>

"s4_0": `<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
<text x="360" y="24" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">刷题四模板：看到题先归类，再套模板（不要一题一题硬想）</text>
<g text-anchor="middle" font-size="12.5">
<rect x="24" y="40" width="160" height="60" rx="8" fill="#2563eb"/><text x="104" y="62" fill="#fff" font-weight="bold">双指针</text><text x="104" y="80" fill="#dbeafe">有序数组/两端收敛</text>
<rect x="200" y="40" width="160" height="60" rx="8" fill="#0ea5e9"/><text x="280" y="62" fill="#fff" font-weight="bold">滑动窗口</text><text x="280" y="80" fill="#e0f2fe">连续子数组/子串</text>
<rect x="376" y="40" width="160" height="60" rx="8" fill="#8b5cf6"/><text x="456" y="62" fill="#fff" font-weight="bold">二分查找</text><text x="456" y="80" fill="#ede9fe">有序 + 找边界</text>
<rect x="552" y="40" width="144" height="60" rx="8" fill="#10b981"/><text x="624" y="62" fill="#fff" font-weight="bold">动态规划</text><text x="624" y="80" fill="#d1fae5">最优子结构</text>
</g>
<rect x="24" y="110" width="672" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="360" y="130" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">识别口诀：有序找值 → 二分；连续区间 → 滑动窗口；两端/两数组 → 双指针；求最值且能拆成子问题 → DP</text>
<text x="360" y="150" text-anchor="middle" font-size="12" fill="#475569">模板骨架：双指针 while(l&lt;r) · 窗口 for(r){ while(不满足) l++; 更新答案 } · 二分 while(l&lt;=r){ mid; 缩边界 } · DP 定义→转移→初始化→遍历顺序</text>
<rect x="24" y="172" width="330" height="112" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="189" y="194" text-anchor="middle" font-size="12.5" fill="#047857" font-weight="bold">三刷法（刷 100 题 &gt; 刷 300 题只刷一遍）</text>
<text x="189" y="214" text-anchor="middle" font-size="12" fill="#065f46">一刷：看懂思路，卡住 20 分钟就看答案</text>
<text x="189" y="232" text-anchor="middle" font-size="12" fill="#065f46">二刷：隔 3 天自己写，不看答案</text>
<text x="189" y="250" text-anchor="middle" font-size="12" fill="#065f46">三刷：考前只刷错题 + 模板题</text>
<text x="189" y="270" text-anchor="middle" font-size="12" fill="#065f46">每道题打标签（窗口/二分/DP），按标签统计掌握度</text>
<rect x="366" y="172" width="330" height="112" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="531" y="194" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">笔试（ACM 模式）和力扣的区别</text>
<text x="531" y="214" text-anchor="middle" font-size="12" fill="#991b1b">力扣只写函数；牛客笔试要自己处理输入输出</text>
<text x="531" y="232" text-anchor="middle" font-size="12" fill="#991b1b">（input().split() / sys.stdin.readline）</text>
<text x="531" y="250" text-anchor="middle" font-size="12" fill="#991b1b">很多人力扣 300 题，笔试却挂在输入输出格式上</text>
<text x="531" y="270" text-anchor="middle" font-size="12" fill="#991b1b">→ 考前专门练 5 道 ACM 模式的题</text>
</svg>`,

"s4_1": `<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
<text x="360" y="24" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">事务隔离级别：越往下越安全、越慢（MySQL 默认 RR）</text>
<g text-anchor="middle" font-size="12.5">
<rect x="24" y="40" width="160" height="46" rx="8" fill="#10b981"/><text x="104" y="60" fill="#fff" font-weight="bold">读未提交</text><text x="104" y="76" fill="#d1fae5">脏读 幻读 都有</text>
<rect x="200" y="40" width="160" height="46" rx="8" fill="#0ea5e9"/><text x="280" y="60" fill="#fff" font-weight="bold">读已提交 RC</text><text x="280" y="76" fill="#e0f2fe">无脏读，有不可重复读</text>
<rect x="376" y="40" width="160" height="46" rx="8" fill="#2563eb"/><text x="456" y="60" fill="#fff" font-weight="bold">可重复读 RR</text><text x="456" y="76" fill="#dbeafe">MySQL 默认</text>
<rect x="552" y="40" width="144" height="46" rx="8" fill="#64748b"/><text x="624" y="60" fill="#fff" font-weight="bold">串行化</text><text x="624" y="76" fill="#e2e8f0">全加锁，最慢</text>
</g>
<rect x="24" y="98" width="672" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="360" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold">RR 如何解决幻读：快照读靠 MVCC（Undo Log 版本链 + ReadView），当前读靠间隙锁 / next-key 锁</text>
<text x="360" y="138" text-anchor="middle" font-size="12" fill="#475569">一句话背下来：<b>普通 SELECT 是快照读，不加锁；SELECT ... FOR UPDATE / UPDATE / DELETE 是当前读，读最新已提交版本并加锁。</b></text>
<rect x="24" y="160" width="330" height="126" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="189" y="182" text-anchor="middle" font-size="12.5" fill="#1d4ed8" font-weight="bold">锁的类型（面试三连问）</text>
<text x="189" y="202" text-anchor="middle" font-size="12" fill="#1e40af">行锁：锁住具体行，InnoDB 靠索引实现</text>
<text x="189" y="220" text-anchor="middle" font-size="12" fill="#1e40af">间隙锁：锁住两条记录之间的"空隙"，防插入</text>
<text x="189" y="238" text-anchor="middle" font-size="12" fill="#1e40af">next-key 锁 = 行锁 + 间隙锁（RR 下默认）</text>
<text x="189" y="256" text-anchor="middle" font-size="12" fill="#1e40af">表锁：DDL 或没走索引时会退化成表锁</text>
<text x="189" y="274" text-anchor="middle" font-size="12" fill="#1e40af"><b>关键：不走索引的 UPDATE 会锁全表</b></text>
<rect x="366" y="160" width="330" height="126" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="531" y="182" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">生产为什么常用 RC</text>
<text x="531" y="202" text-anchor="middle" font-size="12" fill="#991b1b">RR 的间隙锁范围大，并发写冲突多、死锁概率高</text>
<text x="531" y="220" text-anchor="middle" font-size="12" fill="#991b1b">RC 锁更少、并发更高，且"读到别人已提交的数据"</text>
<text x="531" y="238" text-anchor="middle" font-size="12" fill="#991b1b">在多数业务里反而是符合预期的</text>
<text x="531" y="258" text-anchor="middle" font-size="12" fill="#991b1b">代价：RC 下 binlog 必须用 ROW 格式，</text>
<text x="531" y="274" text-anchor="middle" font-size="12" fill="#991b1b">否则主从数据会不一致</text>
</svg>`,

<text x="560" y="118" font-size="11.5" fill="#b91c1c">效果掉 → 回到特征工程，不是调参</text>

<text x="189" y="150" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">数据泄漏：评估结果虚高的头号元凶</text>

<text x="189" y="202" text-anchor="middle" font-size="12" fill="#991b1b"><b>正确姿势：先切分，所有统计量只用训练集算</b></text>

<text x="531" y="168" text-anchor="middle" font-size="12" fill="#1e40af">样本不平衡 → 看 PR 曲线 / F1 / AUC，不看准确率</text>
<text x="531" y="186" text-anchor="middle" font-size="12" fill="#1e40af">宁可漏不能错（如误封号）→ 提精确率</text>
<text x="531" y="202" text-anchor="middle" font-size="12" fill="#1e40af">宁可错不能漏（如风控欺诈）→ 提召回率</text>

/* 进度对照引擎：按阶段 when + 任务 days 估算计划位置（v5.5） */
function stagePlan(st){
  const m = (st.when||"").match(/(\d{4})\.(\d{2})\s*[–-]\s*(\d{4})\.(\d{2})/);
  if(!m) return null;
  const start = new Date(+m[1], +m[2]-1, 1);
  const end = new Date(+m[3], +m[4], 0);
  const daysArr = st.tasks.map(t=>t[2]||3);
  const total = daysArr.reduce((a,b)=>a+b,0);
  return { start, end, daysArr, total, span: Math.max(1, Math.round((end-start)/86400000)) };
}
function planProgress(){
  const now = new Date();
  for(const st of STAGES){
    const p = stagePlan(st);
    if(!p) continue;
    if(now >= p.start && now <= p.end){
      const elapsed = Math.round((now - p.start)/86400000);
      const planDays = p.total * (elapsed / p.span);
      let acc = 0, planCount = 0;
      p.daysArr.forEach((d,i)=>{ acc += d; if(acc <= planDays + 0.5) planCount = i+1; });
      const ids = st.tasks.map((_,i)=>st.id+"_"+i);
      const doneN = ids.filter(taskDone).length;
      const weekRate = p.total / (p.span/7);
      const weekFrom = Math.max(0, planCount - Math.ceil(weekRate));
      return { st, pace: st.pace||"2h/天", planCount, doneN, diff: doneN - planCount, weekIds: ids.slice(weekFrom, planCount), ids, start: p.start };
    }
  }
  for(const st of STAGES){
    const p = stagePlan(st);
    if(p && now < p.start) return { st, pace: st.pace||"2h/天", planCount: 0, doneN: 0, diff: null, weekIds: [], ids: st.tasks.map((_,i)=>st.id+"_"+i), start: p.start, notStarted: true };
  }
  return null;
}
function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function todayStr(){ return fmtDate(new Date()); }
function monthCount(){

function heatCells(){
  const now = new Date();
  const start = new Date(); start.setDate(now.getDate() - 181); /* 26 周 */
  start.setDate(start.getDate() - (start.getDay()+6)%7); /* 对齐到周一 */

    for(let d=0; d<7; d++){

      html += `<i class="ht ${state.checkins[fmtDate(dd)]?"on":""}"></i>`;

}

/* 到期复习：任务完成后按 1/3/7 天记忆曲线提醒，复习后重新计时 */
function reviewDue(){
  const due = []; const now = Date.now(); const DAY = 86400000;
  for(const [id, r] of Object.entries(state.review||{})){
    if(!r || !r.doneAt) continue;
    const base = r.lastRev || r.doneAt;
    const el = now - base;
    const m = el >= 7*DAY ? 7 : el >= 3*DAY ? 3 : el >= 1*DAY ? 1 : 0;
    if(m) due.push({ id, m });
  }
  return due.sort((a,b)=>b.m-a.m).slice(0,6);
}

/* ============ 番茄钟 ============ */
const POMO = { work:25*60, short:5*60, long:15*60 };
const MODE_LABEL = { work:"专注", short:"短休息", long:"长休息" };
let pomo = { ...DEF.pomo, ...state.pomo };
let pomoTotal = store.get("bdlp_pomoTotal", 0);
let ticker = null;

/* 兼容旧数据：运行中但没有时间基准 → 按剩余秒数重建；时间已过 → 补记一次专注 */
if(pomo.running && !pomo.endAt){
  pomo.endAt = Date.now() + pomo.left*1000;
} else if(pomo.running && Date.now() >= pomo.endAt){
  if(pomo.mode === "work") pomoTotal += pomo.dur;
  pomo.running = false;
  pomo.round += (pomo.mode === "work") ? 1 : 0;
  pomo.mode = (pomo.round % 4 === 0) ? "long" : "short";
  pomo.dur = POMO[pomo.mode]; pomo.left = pomo.dur; delete pomo.endAt;
}
if(!pomo.running && pomo.endAt) delete pomo.endAt;

function pomoCommit(){ state.pomo = pomo; save(); store.set("bdlp_pomoTotal", pomoTotal); }
function beep(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const play = (freq, t0) => { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = "sine";
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.18, ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t0+.6);
      o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+.65);
    };
    play(880, 0); play(660, .35);
  } catch(e){}
}
function pomoNext(){
  if(pomo.mode === "work"){
    pomo.round++;
    pomo.mode = (pomo.round % 4 === 0) ? "long" : "short";
  } else { pomo.mode = "work"; }
  pomo.dur = POMO[pomo.mode]; pomo.left = pomo.dur; delete pomo.endAt;
  beep(); toast(`进入${MODE_LABEL[pomo.mode]} ${Math.round(pomo.dur/60)} 分钟`);
  pomoCommit(); renderPomo();
}
function pomoTick(){
  if(!pomo.running) return;
  /* 以 endAt 时间戳校准剩余时间：标签页后台被节流、电脑休眠都不会丢秒 */
  pomo.left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  if(pomo.left <= 0){
    if(pomo.mode === "work") pomoTotal += pomo.dur;
    clearInterval(ticker); ticker = null; pomo.running = false; delete pomo.endAt;
    pomoCommit(); pomoNext(); return;
  }
  updatePomoClock(); /* 仅更新界面，不再每秒写 localStorage */
}
function updatePomoClock(){
  const el = $("#pomoTime");
  if(!el) return;
  const m = String(Math.floor(pomo.left/60)).padStart(2,"0"), s = String(pomo.left%60).padStart(2,"0");
  el.textContent = `${m}:${s}`;
  const ring = $("#pomoRing");
  if(ring) ring.style.background = `conic-gradient(var(--accent) ${(pomo.dur-pomo.left)/pomo.dur*360}deg, var(--bg) 0deg)`;
}
function renderPomo(){
  const tip = ["第 1 个番茄：只做一件事，手机静音放远", "连续 4 个番茄后长休息 15 分钟", "番茄钟不是用来'熬'的，是用来进入心流的", "休息时离开屏幕：喝水、走动、看远处"][pomo.round % 4];
  $("#main").innerHTML = `
  <section class="active">
    <h2 class="sec">番茄钟</h2>
    <p class="sub">25 分钟专注 + 5 分钟休息 · 每 4 轮长休息 · 累计 ${Math.round(pomoTotal/60)} min</p>
    <div class="card pomo">
      <div class="pomo-ring" id="pomoRing"><div class="pomo-inner">
        <div class="pomo-time" id="pomoTime">-</div>
        <div class="pomo-mode">${MODE_LABEL[pomo.mode]} ${Math.round(pomo.dur/60)} 分钟</div>
        <div class="pomo-round">第 ${Math.max(pomo.round,1)} 轮 · 累计 ${Math.round(pomoTotal/60)} 分钟</div>
      </div></div>
      <div class="pomo-ops">
        <button class="btn primary" id="pomoStart">${pomo.running?"暂停":"开始"}</button>
        <button class="btn ghost" id="pomoReset">重置本轮</button>
        <button class="btn ghost" id="pomoSkip">跳过</button>
      </div>
      <div class="pomo-modes">
        <button class="mode-btn ${pomo.mode==="work"?"on":""}" data-m="work">专注 25'</button>
        <button class="mode-btn ${pomo.mode==="short"?"on":""}" data-m="short">短休 5'</button>
        <button class="mode-btn ${pomo.mode==="long"?"on":""}" data-m="long">长休 15'</button>
      </div>
      <div class="pomo-tip">💡 ${tip}</div>
    </div>
  </section>`;
  updatePomoClock();
  $("#pomoStart").addEventListener("click", ()=>{
    if(pomo.running){
      /* 暂停：按时间戳算出剩余秒数并停表 */
      pomo.left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
      pomo.running = false; clearInterval(ticker); ticker = null; delete pomo.endAt;
    } else {
      pomo.running = true;
      pomo.endAt = Date.now() + pomo.left*1000;
      if(!ticker) ticker = setInterval(pomoTick, 500);
    }
    pomoCommit(); renderPomo();
  });
  $("#pomoReset").addEventListener("click", ()=>{ pomo.left = pomo.dur; clearInterval(ticker); ticker=null; pomo.running=false; delete pomo.endAt; pomoCommit(); renderPomo(); });
  $("#pomoSkip").addEventListener("click", ()=>{ clearInterval(ticker); ticker=null; pomo.running=false; delete pomo.endAt; pomoNext(); });
  document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click", ()=>{
    pomo.mode = b.dataset.m; pomo.dur = POMO[pomo.mode]; pomo.left = pomo.dur;
    clearInterval(ticker); ticker = null; pomo.running = false; delete pomo.endAt;
    pomoCommit(); renderPomo();
  }));
}

function isMobileEnv(){
  return /Android|iPhone|iPad|iPod|Mobile|MicroMessenger|WeiXin|QQBrowser|UCBrowser/i.test(navigator.userAgent);
}
function downloadBlob(json, fname){
  const blob = new Blob([json], { type:"application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fname;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
}
function copyText(text, okFn, failFn){
  const done = ok => ok ? okFn() : failFn();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); done(ok);
  }
}
function showExportModal(json, fname){
  $("#mTag").textContent = "备份导出";
  $("#mTitle").textContent = "📋 备份内容（复制保存）";
  $("#mBody").innerHTML = `
    <p style="font-size:13px;color:var(--ink-2);margin:0 0 10px">当前浏览器不支持直接下载文件（微信/手机浏览器常见）。请点下方「📋 复制全部」，粘贴到<strong>备忘录 / 文件传输助手</strong>，另存为 <strong>${esc(fname)}</strong> 即可。</p>
    <textarea id="dumpBox" readonly style="width:100%;height:220px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);white-space:pre;overflow:auto">${esc(json)}</textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn primary" id="dumpCopy" style="flex:1">📋 复制全部</button>
      <button class="btn ghost" onclick="closeModal()">关闭</button>
    </div>`;
  $("#modal").classList.add("show"); document.body.style.overflow = "hidden";
  $("#dumpCopy").addEventListener("click", ()=>{
    copyText(json,
      ()=>{ toast("已复制 ✓ 请粘贴保存"); $("#dumpCopy").textContent = "✅ 已复制"; },
      ()=>{ toast("复制失败，请手动长按文本全选复制"); });
  });
}
$("#exportBtn").addEventListener("click", ()=>{
  /* 备份是静态快照：强制去掉运行中状态，避免导入后按钮显示错乱 */
  try {
    const json = JSON.stringify(makeDump(), null, 2);
    const fname = `学习平台备份_${new Date().toISOString().slice(0,10)}.json`;
    if(isMobileEnv()){
      /* 移动端/微信：优先系统分享文件；不支持则弹出复制方案 */
      try {
        const file = new File([json], fname, { type:"application/json" });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          navigator.share({ files:[file], title:"学习平台备份" })
            .then(()=>{ markBackup(); toast("已分享备份 ✓"); })
            .catch(()=>showExportModal(json, fname));
          return;
        }
      } catch(e){}
      showExportModal(json, fname);
    } else {
      try {
        downloadBlob(json, fname);
        markBackup(); toast("已导出备份 ✓ 请查看下载记录");
      } catch(e){
        console.error(e);
        showExportModal(json, fname);
      }
    }
  } catch(e){
    console.error(e);
    toast("⚠️ 导出失败：" + (e && e.message || e));
  }
});
$("#tipExport").addEventListener("click", ()=>$("#exportBtn").click());
$("#tipClose").addEventListener("click", ()=>{
  $("#backupTip").style.display = "none";
  state.lastBackup = new Date().toISOString(); save();
});
$("#importBtn").addEventListener("click", ()=>$("#importFile").click());
function makeDump(){
  const dump = { ...state, pomo: { ...pomo, running:false }, pomoTotal };
  delete dump.pomo.endAt;
  return dump;
}
function snapshot(kind){ /* kind: daily 每日 | import 导入前 | reset 重置前 */
  try {
    localStorage.setItem("bdlp_snap_" + kind, JSON.stringify({ at: new Date().toISOString(), data: makeDump() }));
  } catch(e){}
}
const SNAP_LABEL = { daily:"每日自动快照", import:"导入前快照", reset:"重置前快照" };
function openSnapshots(){
  $("#mTag").textContent = "数据保护";
  $("#mTitle").textContent = "🛟 本地快照恢复";
  const rows = Object.keys(SNAP_LABEL).map(k=>{
    const raw = LS_OK ? store.get("bdlp_snap_"+k, null) : null;
    if(!raw) return `<div class="snap-row"><div><b>${SNAP_LABEL[k]}</b><br><span class="muted">暂无</span></div><button class="btn ghost small" disabled>不可用</button></div>`;
    const done = TASK_IDS.filter(id=>raw.data.tasks && raw.data.tasks[id]).length;
    const at = new Date(raw.at).toLocaleString("zh-CN");
    return `<div class="snap-row"><div><b>${SNAP_LABEL[k]}</b><br><span class="muted">${esc(at)} · 已完成 ${done} 个任务</span></div><button class="btn primary small" data-snap="${k}">恢复</button></div>`;
  }).join("");
  $("#mBody").innerHTML = `
    <div class="intro">快照保存在本浏览器，是防误操作的"后悔药"：<b>重置、导入覆盖前会自动留一份</b>，每天首次打开也会自动存一份。误删数据时可从这里找回。</div>
    ${rows}
    <p class="muted" style="font-size:12.5px;margin:12px 0 0">恢复会用快照内容替换当前数据；恢复前建议先点"导出备份"留存当前数据。</p>`;
  $("#modal").classList.add("show");
  document.body.style.overflow = "hidden";
  document.querySelectorAll("[data-snap]").forEach(b=>b.addEventListener("click", ()=>{
    const k = b.dataset.snap, raw = store.get("bdlp_snap_"+k, null);
    if(!raw) return;
    if(!confirm(`用「${SNAP_LABEL[k]}」的内容替换当前全部数据？\n（恢复前建议先导出备份留存当前数据）`)) return;
    applyBackup(raw.data, true);
    closeModal();
    toast("快照恢复完成 ✓");
  }));
}
$("#snapBtn").addEventListener("click", openSnapshots);

/* 把备份 JSON 应用到当前状态（导入与快照恢复共用），含基本数据校验 */
function applyBackup(data, replaceAll){
  const isObj = x => x && typeof x === "object" && !Array.isArray(x);
  const pick = (obj, valid) => { const out={}; if(isObj(obj)) for(const k of valid) if(k in obj) out[k]=obj[k]; return out; };
  state.tasks    = pick(data.tasks, TASK_IDS);
  state.mastery  = pick(data.mastery, TASK_IDS);
  if(isObj(data.checkins)) state.checkins = data.checkins;
  if(typeof data.notes === "string") state.notes = data.notes;
  if(Array.isArray(data.logs))  state.logs  = data.logs.filter(x=>x && typeof x.text==="string");
  if(Array.isArray(data.wrong)) state.wrong = data.wrong.filter(x=>x && typeof x.quiz==="string");
  if(isObj(data.pomo)){ pomo = { ...DEF.pomo, ...data.pomo, running:false }; delete pomo.endAt; state.pomo = pomo; }
  if(Number.isFinite(data.pomoTotal)) pomoTotal = data.pomoTotal;
  if(typeof data.lastBackup === "string") state.lastBackup = data.lastBackup;
  if(replaceAll && typeof data.theme === "string") state.theme = data.theme;
  save(); renderActive();
}
$("#importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch(err){ return toast("导入失败：文件格式不对"); }
    if(!confirm("导入规则：任务勾选、技能进度、掌握度、打卡 = 合并；笔记、日志、错题本 = 被备份整体替换。\n\n当前数据已自动存为快照（🛟 可找回）。\n确定继续导入？")) return;
    snapshot("import");
    applyBackup(data, false);
    toast("导入成功 ✓");
  };
  r.readAsText(f); e.target.value = "";
});
$("#resetBtn").addEventListener("click", ()=>{
  if(!confirm("确定清空所有学习数据？\n（清空前会自动存一份「重置前快照」，可在 🛟 快照恢复 找回）")) return;
  snapshot("reset");
  localStorage.removeItem("bdlp_v1"); localStorage.removeItem("bdlp_pomoTotal");
  location.reload();
});

/* ============ 全局搜索 ============ */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  const idx = [];
  for(const st of STAGES) st.tasks.forEach(([name,desc],i)=>{
    const key = `${st.id}_${i}`;
    idx.push({ key, tag: st.badge, title: name, text: `${name} ${desc} ${(DETAILS[key]?.pts||[]).join(" ")} ${(DETAILS[key]?.pit||"")} ${(DETAILS[key]?.deep?.go||"")} ${(DETAILS[key]?.deep?.tasks||[]).join(" ")}` });
  });
  for(const [k, terms] of Object.entries(TERMS)){
    idx.push({ key:k, tag:"名词", title: terms[0][0], text: terms.map(t=>t[0]+t[1]).join(" ") });
  }
  searchIndex = idx;
  return idx;
}
const $searchInput = $("#searchInput"), $searchRes = $("#searchRes");
function hl(text, q){
  const t = String(text), i = t.toLowerCase().indexOf(q);
  if(i < 0) return esc(t);
  return esc(t.slice(0,i)) + "<mark>" + esc(t.slice(i, i+q.length)) + "</mark>" + esc(t.slice(i+q.length));
}
$searchInput.addEventListener("input", ()=>{
  const q = $searchInput.value.trim().toLowerCase();
  if(!q){ $searchRes.classList.remove("show"); return; }
  const hits = buildSearchIndex().filter(x=>x.text.toLowerCase().includes(q) || x.title.toLowerCase().includes(q)).slice(0,12);
  $searchRes.innerHTML = hits.length ? hits.map(h=>`
    <div class="sr-item" data-k="${h.key}"><span class="sg">${h.tag}</span><span class="st">${hl(h.title, q)}</span></div>
  `).join("") : `<div class="sr-empty">没有找到「${esc($searchInput.value)}」，换个关键词试试</div>`;
  $searchRes.classList.add("show");
});
$searchRes.addEventListener("click", e=>{
  const it = e.target.closest(".sr-item"); if(!it) return;
  $searchRes.classList.remove("show");
  $searchInput.value = "";
  openDetail(it.dataset.k);
});
document.addEventListener("click", e=>{ if(!e.target.closest(".search-wrap")) $searchRes.classList.remove("show"); });
$searchInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const first=$searchRes.querySelector(".sr-item"); if(first){ $searchRes.classList.remove("show"); $searchInput.value=""; openDetail(first.dataset.k);} } });

/* ============ 初始化 ============ */
applyTheme();
renderDash();
/* 首次打开：弹一次「数据仅存本机」说明（之后不再打扰） */
maybeFirstVisitTip();
/* 存储不可用（无痕/隐私模式）→ 顶部红色警告，避免学习一天全白费 */
if(!LS_OK) $("#lsWarn").style.display = "flex";
/* 每日自动快照：一天一份滚动覆盖，作为"清缓存/误操作前的最后防线" */
if(LS_OK && store.get("bdlp_snap_day","") !== todayStr()){
  snapshot("daily");
  store.set("bdlp_snap_day", todayStr());
}
/* 番茄钟若在计时（刷新/重开页面后）：恢复计时器 */
if(pomo.running && !ticker) ticker = setInterval(pomoTick, 500);
/* 从后台切回标签页时立即校准倒计时 */
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && pomo.running) pomoTick(); });
/* 支持 #tasks 等直达链接 */
(()=>{
  const h = location.hash.replace("#","");
  if(TAB_ORDER.includes(h) && h !== "dash") gotoTab(h);
})();
window.addEventListener("beforeunload", ()=>{ clearInterval(ticker); pomoCommit(); });

</script>
