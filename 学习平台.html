<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大数据学习平台 · 大三冲刺 11 个月</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E%E6%95%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6fa;--card:#ffffff;--ink:#1b2230;--ink-2:#49536a;--ink-3:#8a93a8;
    --line:#e3e8f0;--accent:#2563eb;--accent-soft:#eaf0fe;
    --red:#d93025;--red-soft:#fdeeec;--green:#0f9d58;--green-soft:#e8f6ef;
    --amber:#c77700;--amber-soft:#fff4e0;--purple:#6b3fa0;--purple-soft:#f2ecfa;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 6px 22px rgba(20,30,60,.05);
    --r:14px;
  }
  [data-theme="dark"]{
    --bg:#12161f;--card:#1b2130;--ink:#e8ecf5;--ink-2:#aab3c7;--ink-3:#6b7590;
    --line:#2a3247;--accent:#5b8def;--accent-soft:#1d2a49;
    --red-soft:#3a1f1c;--green-soft:#12291e;--amber-soft:#33270e;--purple-soft:#261b38;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px 80px}

  /* top bar */
  .top{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .brand .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:inline-block}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .count-chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow)}
  .count-chip b{color:var(--accent);font-variant-numeric:tabular-nums}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.2s}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* tabs */
  .tabs{display:flex;gap:4px;margin:16px 0 20px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow)}
  .tab{flex:1;min-width:92px;text-align:center;padding:9px 6px;border:none;background:transparent;color:var(--ink-3);font-size:13.5px;font-weight:700;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap}
  .tab:hover{color:var(--ink-2);background:var(--bg)}
  .tab.active{background:var(--accent);color:#fff}
  .tab .ic{display:block;font-size:15px;margin-bottom:2px}
  @media(max-width:640px){.tab{min-width:74px;font-size:12px}}

  main section{display:none}
  main section.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h2.sec{font-size:19px;margin:6px 0 4px;letter-spacing:-.01em}
  p.sub{color:var(--ink-3);font-size:13.5px;margin:0 0 16px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}

  /* dashboard */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
  .stat{padding:16px 18px}
  .stat .k{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;color:var(--ink-3);font-weight:600}
  .stat .d{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ring .rv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .ring .rl{font-size:11px;color:var(--ink-3)}
  .today{flex:1;min-width:240px}
  .today h4{margin:0 0 10px;font-size:14.5px}
  .todo-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;color:var(--ink-2)}
  .todo-item:last-child{border-bottom:none}
  .todo-item .no{flex:none;width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:800;display:grid;place-items:center}
  .empty-hint{color:var(--ink-3);font-size:13.5px;padding:8px 0}
  .btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px}

  /* stages / tasks */
  .stage{margin-bottom:14px;overflow:hidden}
  .stage-hd{display:flex;align-items:center;gap:13px;padding:13px 18px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
  .stage-hd .badge{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:7px;padding:3px 9px;letter-spacing:.05em;flex:none}
  .stage-hd h3{margin:0;font-size:15.5px;flex:1}
  .stage-hd .when{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .stage-hd .pct{font-size:12.5px;font-weight:800;color:var(--accent);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .stage-hd .arrow{color:var(--ink-3);font-size:12px;transition:transform .2s}
  .stage.collapsed .arrow{transform:rotate(-90deg)}
  .stage-bd{display:none;padding:6px 18px 14px}
  .stage:not(.collapsed) .stage-bd{display:block}
  .task{display:flex;align-items:flex-start;gap:11px;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{width:17px;height:17px;margin-top:4px;accent-color:var(--accent);cursor:pointer;flex:none;pointer-events:none}
  .task .t-main{flex:1}
  .task .t-name{font-size:14.3px;font-weight:600}
  .task .t-desc{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .task.done .t-name{text-decoration:line-through;color:var(--ink-3)}
  .task .t-est{font-size:11.5px;color:var(--ink-3);flex:none;margin-top:3px}

  .sbar{background:var(--bg);border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--line)}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:8px;transition:width .4s}

  /* pomodoro */
  .pomo{display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:6px}
  .pomo-ring{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) 0deg,var(--bg) 0deg);transition:background .1s}
  .pomo-ring::before{content:"";position:absolute;inset:14px;background:var(--card);border-radius:50%;border:1px solid var(--line)}
  .pomo-inner{position:relative;text-align:center}
  .pomo-time{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pomo-mode{font-size:13px;color:var(--ink-3);font-weight:700}
  .pomo-round{font-size:12px;color:var(--ink-3);margin-top:2px}
  .pomo-ops{display:flex;gap:10px;margin-top:16px}
  .pomo-modes{display:flex;gap:6px;margin-top:14px}
  .mode-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .mode-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pomo-tip{max-width:520px;text-align:center;font-size:13px;color:var(--ink-3);margin-top:14px}

  /* notes */
  .notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.notes-grid{grid-template-columns:1fr}}
  .notes-grid textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:13px;font-size:13.5px;font-family:inherit;line-height:1.7;resize:vertical}
  .notes-grid textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .log-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.8px}
  .log-item:last-child{border-bottom:none}
  .log-item .ld{flex:none;font-size:11.5px;color:var(--ink-3);font-weight:700;padding-top:3px;min-width:92px}
  .log-item .lt{flex:1;color:var(--ink-2);white-space:pre-wrap}
  .log-item .del{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
  .log-item .del:hover{background:var(--red-soft);color:var(--red)}
  .muted{color:var(--ink-3);font-size:12.5px}

  /* resources */
  .res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .res-card h4{margin:0 0 10px;font-size:14.5px}
  .res-card ul{margin:0;padding-left:2px;list-style:none}
  .res-card li{margin-bottom:9px;font-size:13.8px}
  .res-card a{color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:1px solid transparent}
  .res-card a:hover{color:var(--accent);border-color:var(--accent)}
  .res-card .rd{display:block;font-size:12px;color:var(--ink-3);font-weight:400}

  /* data mgmt */
  .data-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .data-bar .muted{margin-right:auto}

  /* modal */
  .modal-mask{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:0;overflow:auto}
  .modal-mask.show{display:flex;animation:fade .2s ease}
  .modal{background:var(--card);border:none;border-radius:0;box-shadow:none;max-width:none;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;animation:fade .18s ease}
  @keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal-hd{display:flex;align-items:center;gap:12px;padding:16px 34px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:0;z-index:2;flex:none}
  .modal-hd .badge{font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:7px;padding:3px 9px;letter-spacing:.05em;flex:none}
  .modal-hd h3{margin:0;font-size:16.5px;flex:1}
  .modal-x{background:none;border:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}
  .modal-x:hover{background:var(--red-soft);color:var(--red)}
  .modal-bd{padding:26px 34px 16px;font-size:14.5px;color:var(--ink-2);flex:1;min-height:0;overflow:auto}
  .modal-bd .intro,.modal-bd .pit,.modal-bd .quiz,.modal-bd details{max-width:1040px}
  .modal-bd h4{font-size:13px;letter-spacing:.05em;color:var(--ink-3);margin:16px 0 8px;font-weight:800}
  .modal-bd h4:first-child{margin-top:0}
  .modal-bd .intro{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink);margin-bottom:4px}
  .modal-bd details{background:var(--amber-soft);border:1px dashed #e2c98a;border-radius:10px;padding:10px 14px;margin:4px 0 6px}
  .modal-bd details summary{cursor:pointer;font-size:13.5px;font-weight:800;color:#8a5400;user-select:none}
  .modal-bd details summary:hover{opacity:.8}
  .modal-bd .terms-list{margin:8px 0 2px;padding:0;list-style:none}
  .modal-bd .terms-list li{padding:6px 0 6px 2px;font-size:13.5px;color:var(--ink);border-bottom:1px dashed rgba(194,164,90,.35)}
  .modal-bd .terms-list li:last-child{border-bottom:none}
  .modal-bd .terms-list li::before{content:"";display:none}
  .modal-bd .terms-list b{color:var(--amber);font-weight:800;background:rgba(255,255,255,.55);padding:1px 6px;border-radius:5px;margin-right:6px}
  .modal-bd .tl-eg{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
  .modal-bd ul{margin:0;padding-left:2px;list-style:none}
  .modal-bd ul li{position:relative;padding:5px 0 5px 20px;font-size:14px}
  .modal-bd ul li::before{content:"▸";position:absolute;left:2px;color:var(--accent);font-weight:800}
  .modal-bd ul li b{color:var(--ink)}
  .modal-bd code{background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
  .modal-bd .pit{background:var(--amber-soft);border-radius:10px;padding:11px 14px;font-size:13.5px;color:#8a5400;margin-top:2px}
  .modal-bd .pit b{color:#5c3800}
  .modal-bd .quiz{background:var(--green-soft);border-radius:10px;padding:11px 14px;font-size:13.5px;color:#0b6b3f;margin-top:2px}
  .modal-bd .quiz b{color:#084a2c}
  .modal-ft{padding:12px 22px 18px;text-align:right}
  .kbtn{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;flex:none;transition:.15s}
  .kbtn:hover{background:var(--accent);color:#fff}
  .task .kbtn{margin-top:2px}
  .skill-row .kbtn{padding:4px 9px}

  /* 打卡 */
  .checkin-grid{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ci{width:34px;height:44px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--ink-3);gap:2px}
  .ci.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:800}
  .ci .d{font-size:13px;font-weight:700}
  .ci .w{font-size:9px}
  .ci.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  /* 掌握度 */
  .mbtn{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink-3);font-size:11px;cursor:pointer;margin-top:2px;display:grid;place-items:center;font-weight:800;transition:.15s}
  .mbtn[data-m="1"]{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .mbtn[data-m="2"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .mbtn[data-m="3"]{border-color:#b8860b;color:#b8860b;background:#fdf6e3}
  .mbtn:hover{transform:scale(1.12)}
  .mastery-bar{display:flex;gap:8px;margin:4px 0 10px}
  .m-choice{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;transition:.15s}
  .m-choice[data-m="0"]:hover,.m-choice[data-m="0"].sel{border-color:var(--ink-3);color:var(--ink)}
  .m-choice[data-m="1"]:hover,.m-choice[data-m="1"].sel{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .m-choice[data-m="2"]:hover,.m-choice[data-m="2"].sel{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .m-choice[data-m="3"]:hover,.m-choice[data-m="3"].sel{border-color:#b8860b;color:#b8860b;background:#fdf6e3}
  .wrong-btn{width:100%;border:1.5px dashed var(--red);background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}
  .wrong-btn:hover{background:var(--red);color:#fff}
  /* 深入学习板块 */
  .deep{background:var(--blue-soft);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--ink-2);margin-bottom:10px}
  .deep b{color:var(--accent)}
  .deep-hd{font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin:2px 0 6px}
  .deep-tasks{list-style:none;margin:0;padding:0}
  .deep-tasks li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;color:var(--ink-2)}
  .deep-tasks li:last-child{border-bottom:none}
  .deep-tasks label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
  .deep-tasks input[type=checkbox]{width:16px;height:16px;margin-top:4px;accent-color:var(--green);flex:none;cursor:pointer}
  .deep-tasks li.on span{text-decoration:line-through;color:var(--ink-3)}
  /* 图表 / 代码块 / 术语导读 / 求助卡（v5.7） */
  .diagram{margin:2px 0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 10px 6px;overflow-x:auto}
  .diagram svg{display:block;width:100%;min-width:720px;height:auto}
  .diagram figcaption{font-size:12px;color:var(--ink-3);text-align:center;margin:4px 0 2px}
  .code-hd{font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin:2px 0 6px}
  .code-block{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12.5px;line-height:1.65;overflow-x:auto;white-space:pre;margin:0 0 12px}
  .term-hint{background:var(--accent-soft);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:10px;line-height:1.6}
  .term-hint b{color:var(--accent)}
  .help-card{border:1.5px dashed var(--amber);background:rgba(245,158,11,.08);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.75}
  .help-card b{color:var(--amber)}
  .res-link{font-weight:700;color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
  .res-link:hover{opacity:.75}
  .low-actions{display:grid;gap:8px;margin:10px 0}
  .low-actions .btn{width:100%}
  /* 任务时长 + 当前建议（v5.5） */
  .tdays{display:inline-block;margin-left:10px;font-size:11.5px;color:var(--ink-3);background:rgba(127,140,170,.12);border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap;transform:translateY(-1px)}
  .cur-tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:1px 8px;margin-right:8px;transform:translateY(-1.5px)}
  /* 环境搭建引导卡 */
  .env-card{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:8px 0 4px;cursor:pointer}
  .env-card .t-name{font-weight:800;font-size:14.5px}
  .env-card .t-desc{font-size:13px;color:var(--ink-3)}
  .env-card:hover{filter:brightness(.98)}
  /* 作品化模板（deep.tpl） */
  .deep-tpl{background:var(--card);border:1.5px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
  .deep-tpl b{color:var(--accent)}
  /* 折叠式参考答案 */
  .q-ans{margin:4px 0 2px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0}
  .q-ans summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--green);padding:8px 12px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
  .q-ans summary::before{content:"👀"}
  .q-ans[open] summary{border-bottom:1px dashed var(--line)}
  .q-ans .a-body{padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
  .q-ans .a-body b{color:var(--ink)}
  .q-follow{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-3)}
  .q-follow b{color:var(--amber)}

  "【场景题】一张订单表 orders(oid, uid, amt, created_at) 与用户表 users(uid, city)：统计每个城市 2026 年 8 月的订单总额与订单数，只保留订单数 >10 的城市，按总额降序。写出 SQL。"], ans:["用 <b>WHERE 右表.关联键 IS NULL</b>（如 WHERE u.id IS NULL）。SQL 中 NULL 表示「未知」，= NULL 的结果永远是 UNKNOWN（既非真也非假），所以一行都过滤不出来；判断空必须用 IS NULL / IS NOT NULL。","<b>WHERE 在分组前过滤行</b>（不能引用聚合结果），<b>HAVING 在分组后过滤组</b>（可以引用 COUNT/SUM）。例：只要订单数>5 的用户 → HAVING COUNT(*)>5；只要 2026 年的订单 → WHERE create_time>='2026-01-01'，放 WHERE 更早过滤、更高效。","SELECT u.id, u.name, COUNT(o.id) AS cnt, COALESCE(SUM(o.amount),0) AS total FROM users u LEFT JOIN orders o ON u.id=o.user_id GROUP BY u.id, u.name; 三个要点：LEFT JOIN 保留没下单的用户；COUNT(o.id) 不数 NULL 所以是 0；SUM 遇到 NULL 要用 COALESCE 转 0。",

"s0_1":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s0_0 SQL 基础：JOIN / 聚合 / CTE</b>——JOIN 和聚合是窗口函数的地基。</span>窗口函数是 SQL 从'能干活'到'能干复杂活'的分水岭，也是校招面试手写 SQL 的必考点。它让你在不动行数的情况下，跨行计算。",
  pts:[
    "<b>与聚合的区别</b>：聚合函数把多行压成一行（GROUP BY 后行数变少）；窗口函数保持每行原样，在每行旁边附加计算列——这是最重要的心智模型",
    "<b>三大类窗口函数</b>：① 排序类 ROW_NUMBER / RANK / DENSE_RANK（区别：并列时怎么跳号，1,1,3 还是 1,1,2）；② 分析类 LAG / LEAD（取前后 N 行，做环比、同比）；③ 聚合类 SUM / AVG OVER（做累计、移动平均）",
    "<b>PARTITION BY vs GROUP BY</b>：PARTITION BY 只是划窗口，不合并行；分区内才计算，跨分区各自独立",
    "<b>ORDER BY 在窗口内的作用</b>：无 ORDER BY 时窗口是整组；有 ORDER BY 时默认累计到当前行（running total），这是 SUM() OVER(ORDER BY ...) 出现累计效果的原理",
    "<b>经典应用模板</b>：TopN 问题 = ROW_NUMBER() OVER(PARTITION BY 组 ORDER BY 指标 DESC) 然后 WHERE rn &lt;= N；去重取最新 = ROW_NUMBER() OVER(PARTITION BY 主键 ORDER BY 时间 DESC) 取 rn=1",
    "<b>连续问题</b>：连续登录 / 连续签到 = 用日期减 ROW_NUMBER 生成'连续组号'，再按组号聚合计数——这是面试最爱的套路题"
  ],
  pit:"别把 RANK 和 ROW_NUMBER 混用后说不清结果；也别忘记窗口函数不能用普通 WHERE 过滤（要包一层子查询）。连续问题的'日期减序号'技巧没掌握前，别急着刷下一题。",
  quiz:["写出：每个部门薪资 Top3 的员工（含并列处理）","写出：统计连续登录 3 天及以上的用户数","LAG(amount,1) OVER(ORDER BY dt) 表示什么？如何用它算环比增长率？"], ans:["SELECT * FROM (SELECT name, dept, salary, DENSE_RANK() OVER(PARTITION BY dept ORDER BY salary DESC) rk FROM emp) t WHERE rk<=3; 关键：<b>并列用 DENSE_RANK</b>（1,1,2）；RANK 会跳号（1,1,3）；不并列用 ROW_NUMBER。窗口函数不能直接写进 WHERE，必须包一层子查询。","核心技巧「日期减序号」：先对 (uid,dt) 去重，再 ROW_NUMBER() OVER(PARTITION BY uid ORDER BY dt)，用 DATE_SUB(dt, INTERVAL rn DAY) 得到分组号 grp（连续日期算出的 grp 相同），最后 GROUP BY uid,grp HAVING COUNT(*)>=3。忘记去重会让同一天多次登录被重复计数。","LAG(amount,1) OVER(ORDER BY dt) 表示<b>按 dt 排序后「上一行」的 amount</b>（滞后一行）。环比增长率 =(amount - LAG(...)) / LAG(...)，通常包一层子查询避免窗口函数写两遍。LEAD 取下一行，同理。"],
  res:"牛客 SQL 困难档的'连续登录、留存率、TopN'类题目刷 20 道以上，直到不看答案能独立写出",
  deep:{ go:"<b>深入目标：吃透窗口函数的执行时机与套路</b>。理解它执行在 GROUP BY 之后、ORDER BY 之前；掌握窗口帧（ROWS BETWEEN）语法；分清 row_number / rank / dense_rank 的适用场景；掌握「日期减序号」解连续问题的核心技巧。<b>深入标志：7 日留存、连续登录、TopN、环比同比四类题，不看答案 10 分钟内写完。</b>", tasks:["「连续登录 3 天的用户数」分别用日期减序号法和 lag 法各写一遍，对比优劣","写完整 7 日留存率 SQL，并把分母口径（新增口径）讲给同学听","部门内薪资 Top3（含并列）：分别用窗口函数和关联子查询实现","画一张 SQL 语句各子句的执行顺序图，贴在笔记首页"] }

  pts:[

    "<b>为什么慢的三大原因</b>：全表扫描（type=ALL）、文件排序（Using filesort，ORDER BY 没走索引）、临时表（Using temporary，GROUP BY/DISTINCT 没走索引）",
    "<b>索引失效的常见写法</b>：对索引列用函数、隐式类型转换、LIKE 以 % 开头、OR 连接非索引条件、联合索引不满足最左前缀",

    "<b>大数据场景的差异</b>：Hive / Spark SQL 的执行计划看的是 stage 和 shuffle，原理相通但形态不同；先吃透 MySQL 的，后面迁移理解"

  pit:"只看'加了索引'不看执行计划，等于没优化。很多人加了一堆索引反而拖慢写入——索引不是越多越好。",
  quiz:["EXPLAIN 里 type=ALL 和 type=ref 各代表什么？哪个快？","为什么 WHERE YEAR(create_time)=2026 会让索引失效？怎么改？","Extra 出现 Using filesort 说明什么问题？"], ans:["type 是访问类型：<b>ALL = 全表扫描</b>（最差，逐行扫）；<b>ref = 用非唯一索引等值匹配</b>（较好）。从好到差：system > const > eq_ref > ref > range > index > ALL。看到 ALL 且 rows 很大，就该考虑加索引了。","因为<b>对索引列套了函数</b>，B+ 树无法利用索引的有序性定位（必须先算出每行的函数值再比较）。改成范围查询：WHERE create_time >= '2026-01-01' AND create_time < '2027-01-01'。原则：索引列要「裸着」出现在比较符一侧。","说明<b>排序无法利用索引顺序</b>，MySQL 需要额外做一次排序（可能在内存或落磁盘），数据量大时是主要慢点。优化方向：给 ORDER BY 的字段建联合索引，或让 WHERE 条件与 ORDER BY 一起满足最左前缀，先减少参与排序的数据量。"],

  quiz:["自测：不看笔记写出'连续登录 3 天用户数'","自测：写出'每个商品类目下销量 Top3 的商品'","自测：写出'7 日留存率的完整 SQL'（含明细层和汇总层两种写法）"], ans:["默写自检 5 点：① 先对 (uid,dt) 去重 ② ROW_NUMBER() PARTITION BY uid ORDER BY dt ③ 日期减序号生成 grp ④ GROUP BY uid,grp HAVING COUNT(*)>=3 ⑤ 跨月跨年不出错（按天减不会错）。能默写并讲清每步理由才算过关。","SELECT * FROM (SELECT category, product_id, SUM(qty) total, ROW_NUMBER() OVER(PARTITION BY category ORDER BY SUM(qty) DESC) rn FROM order_detail GROUP BY category, product_id) t WHERE rn<=3; 要点：先聚合到 (类目,商品) 粒度再开窗；窗口函数里可以直接引用聚合结果 SUM(qty)（执行顺序上 GROUP BY 先于窗口函数）。","定义：第 0 日新增用户在第 7 日是否活跃。明细层写法：以「首登表」a 为分母，LEFT JOIN login b ON a.uid=b.uid AND b.dt = DATE_ADD(a.dt, INTERVAL 7 DAY)，留存率 = COUNT(DISTINCT b.uid) / COUNT(DISTINCT a.uid)。两个关键点：分母是当天新增（首登日期=a.dt）；join 条件必须写在 ON 上，写进 WHERE 会把 LEFT JOIN 变成 INNER JOIN。"],
  res:"牛客 SQL 题库 + LeetCode 数据库题；建议配一个错题本（平台笔记区即可）",
  deep:{ go:"<b>深入目标：从「做出这道题」到「沉淀出题型模板」</b>。把 100 题归纳成五大模板：连续问题、留存分析、TopN、去重取最新、累积占比（帕累托）。<b>深入标志：拿到新题 5 分钟内识别出属于哪类模板、套哪个骨架。</b>", tasks:["建「SQL 模板仓库」：每类模板一个文件，README 做索引，持续更新","每个模板脱离资料手写 3 遍，最后一遍计时","把做错的题录入平台错题本，7 天后重做验证","和同学互相出题：只许口述思路，训练面试表达"] }
},
"s0_4":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>🧰 环境搭建指南</b>——Python 装好且 venv 会用了再开始。</span>Python 是数据岗位的通用语言，和 SQL 搭配构成'取数+处理'的黄金组合。零基础阶段的目标：能读、能改、能写 200 行内的脚本。",
  pts:[
    "<b>核心语法</b>：变量与类型（int/float/str/bool/None）、列表与字典（增删改查）、条件与循环、函数定义与返回值、异常处理 try/except",
    "<b>列表推导式</b>：[x*2 for x in nums if x&gt;0]，比手写循环简洁，读别人代码时高频出现",
    "<b>字典是 Python 的核心数据结构</b>：键值查询 O(1)，做去重、计数、分组都靠它",
    "<b>字符串与文件</b>：字符串格式化（f-string）、split/join、open() 读写的 with 语法（自动关闭文件）",
    "<b>模块与包</b>：import 的三种写法、pip 安装依赖、虚拟环境 venv 的意义（隔离依赖版本）",
    "<b>面向对象不求深</b>：理解 class 的基本写法即可，数据岗日常 90% 是写脚本和函数，不是设计类体系"
  ],
  pit:"别一开始就啃《流畅的 Python》这种进阶书。先能写脚本跑起来，再谈优雅。也别把 Python 当 C 语言写——列表推导式、内置函数 max/min/sorted/key 要会用。",
  quiz:["用字典统计一个列表里每个元素出现的次数","写一个函数：输入一个路径，读取 CSV 并返回前 5 行","f-string 是什么？写一个例子：'用户 张三 在 2026 年 8 月 31 日登录'"], ans:["from collections import Counter; Counter(lst).most_common(5)；或手写 d={}; for x in lst: d[x]=d.get(x,0)+1。要点：<b>dict.get(key, 0) 是最常用的计数惯用法</b>，比 try/except 和 setdefault 更直观。","import csv\ndef read_head(path, n=5):\n    with open(path, newline='', encoding='utf-8') as f:\n        return [row for _, row in zip(range(n), csv.reader(f))]\n要点：用 with 保证文件关闭、显式 encoding 防乱码、zip+range 避免大文件全读。pandas 一行版：pd.read_csv(path, nrows=5)。","f-string 是格式化字符串字面量，字符串前加 f，用 {} 嵌入变量或表达式：f'用户 {name} 在 {y} 年 {m} 月 {d} 日登录' → 用户 张三 在 2026 年 8 月 31 日登录。比 % 和 .format() 更快更易读；支持格式规范 f'{pi:.2f}'、对齐 f'{s:>10}'，Python 3.6+ 可用。"],
  res:"菜鸟教程 / Python 官方教程前 8 章即可，配合每天 30 分钟编码练习",
  deep:{ go:"<b>深入目标：从「能跑」到「理解对象模型」</b>。搞懂可变/不可变类型、深浅拷贝、变量引用与作用域、装饰器原理、生成器为什么省内存。<b>深入标志：能解释「为什么函数默认参数不能是可变对象」这类经典面试题。</b>", tasks:["用生成器写一个逐行处理大文件的脚本，和一次性读入对比内存占用","手写 3 个实用装饰器：计时、失败重试、结果缓存","LeetCode 简单题刷 20 道，重点数组与哈希表","整理「Python 十大易错点」笔记，每条配一个能复现的最小示例"] }
},
"s0_5":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s0_4 Python 基础语法</b>——至少会列表/字典/函数再碰 pandas。</span>pandas 是 Python 里处理表格数据的核心库，地位相当于'Python 版 Excel + SQL'。数据岗日常 70% 的表格操作都在用它。",
  pts:[
    "<b>两大对象</b>：Series（一列，带索引）和 DataFrame（表格，行列都有索引）；理解索引（index）是 pandas 的灵魂",
    "<b>读写</b>：read_csv / read_excel / to_csv，注意 encoding='utf-8' 和 sep 参数",
    "<b>筛选与修改</b>：df[df['col'] &gt; 100] 布尔筛选；df.loc[行, 列] 按标签、df.iloc 按位置；新增列 df['新列'] = 计算",
    "<b>分组聚合</b>：df.groupby('类别')['金额'].agg(['sum','mean','count'])，对应 SQL 的 GROUP BY",
    "<b>合并</b>：pd.merge 对应 SQL JOIN（how='left/inner'），pd.concat 纵向拼接",
    "<b>清洗三件套</b>：dropna / fillna 处理缺失、drop_duplicates 去重、astype 类型转换——清洗是数据工作最耗时也最体现功力的环节",
    "<b>透视</b>：pivot_table（行、列、值、聚合方式），对应 Excel 数据透视表"
  ],
  pit:"pandas 的坑：链式赋值（df[df.a&gt;0]['b']=1 会警告且不生效）；视图与副本混淆；merge 忘写 how 默认是 inner。遇到诡异结果先怀疑这三处。",
  quiz:["读入 CSV 后，如何按'城市'分组求'销售额'的总和？","merge 和 concat 使用场景有什么区别？","NaN 值如何判断？为什么不能直接用 == np.nan？"], ans:["df.groupby('城市')['销售额'].sum()；多指标用命名聚合：df.groupby('城市').agg(销售额=('销售额','sum'), 订单数=('订单号','count'))。要点：命名聚合可读性好、直接产出干净的列名；结果索引是城市，想变回列用 reset_index()。","<b>merge 是按关联键横向拼接</b>（类似 SQL JOIN，要指定 on / how）；<b>concat 是沿轴堆叠</b>：axis=0 纵向追加同结构数据（多天日志合并），axis=1 按索引横向拼接（不按业务键）。判断依据：有没有「关联键」——有就用 merge，只是堆更多行就用 concat。","用 pd.isna(x) / df['col'].isna()（数值也可用 np.isnan）。不能用 == np.nan，因为 <b>IEEE 754 规定 NaN 与任何值（包括它自己）比较都为 False</b>，必须用专门函数判断。注意 None、NaT 同样用 isna 判断；整列判空用 df.isna().sum()。"],
  res:"《利用 Python 进行数据分析》(Wes McKinney 著) 前 8 章 + 每天用真实数据练 30 分钟",
  deep:{ go:"<b>深入目标：理解 pandas 的设计思想而非记 API</b>。搞懂 Index 对齐机制、groupby 的 split-apply-combine 模型、向量化为什么比循环快几个数量级、SettingWithCopyWarning 的成因。<b>深入标志：任何 for 循环数据处理逻辑，都能尝试改写成向量化写法。</b>", tasks:["把项目 0 的清洗逻辑用 pandas 重写，对比代码行数和运行时间","groupby 的 agg / transform / apply 三种用法各练 5 个例子","找一份脏数据集（Kaggle 很多），完整走一遍缺失/重复/异常值处理","通读官方 10 minutes to pandas，把不熟的知识点补进笔记"] }
},
"s0_6":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s0_4 Python 基础 + s0_5 pandas</b>——会语法和表格处理，抓回来的数据才有地方落。</span>requests 是 Python 抓取 HTTP 接口的标准库级工具。学会它，你就能自己造数据源——任何公开 API、网页数据都能变成你的练习数据。",
  pts:[
    "<b>核心流程</b>：requests.get(url, params, headers) → 检查 resp.status_code → 解析内容 resp.json() 或 resp.text → 清洗 → 落盘",
    "<b>params 与 headers</b>：GET 参数用 params 字典；很多接口要求 User-Agent 等请求头，否则返回 403",
    "<b>JSON 解析</b>：resp.json() 直接转字典/列表；嵌套结构用 字典['key'][索引] 逐层取",
    "<b>文件读写</b>：with open('data.csv','w',encoding='utf-8') as f 写入；用 csv 模块或 pandas.to_csv",
    "<b>异常与重试</b>：网络请求要 try/except 包裹，time.sleep(1) 控制频率，避免被封",
    "<b>合法边界</b>：只抓公开数据、遵守 robots.txt、不抓个人信息、控制频率不骚扰对方服务器——这是职业底线也是法律底线"
  ],
  pit:"别一上来就抓反爬很强的网站（如大厂电商），先抓开放的公开接口（天气、汇率、公开榜单）。'抓不到'时先怀疑：是不是没带 headers？是不是频率太快？",
  quiz:["requests.get 返回 403 通常是什么原因？怎么排查？","resp.json() 报错 JSONDecodeError 时怎么办？","如何把抓到的数据安全地写入 CSV（处理特殊字符）？"], ans:["403 = 服务器理解请求但拒绝执行。常见原因：缺 User-Agent 被反爬拦截、需要登录 Cookie/鉴权、Referer 校验、IP 被封。排查顺序：先用浏览器确认能访问 → 补 UA/Referer → 带 Cookie → 降低频率 → 看响应 body 的真实提示 → 检查 robots.txt 与合规性。","说明返回内容不是合法 JSON（可能是 HTML 错误页、登录跳转页或空响应）。处理：先打印 resp.status_code 和 resp.text[:200] 看真实内容；代码里用 try/except ValueError 兜住 resp.json()，失败时记录原文并返回 None 或重试，而不是让整个脚本崩掉。","用 csv 模块或 pandas.to_csv，<b>不要手工拼逗号</b>（内容含逗号/引号/换行会破坏格式）。要点：encoding='utf-8-sig' 让 Excel 打开中文不乱码；open 时加 newline='' 防空行；csv.writer 会自动处理转义与引号；写入前把字段统一转字符串并 strip。"],
  res:"找一个免费公开 API（如天气类），把数据抓下来存成 CSV，作为项目 0 的素材",
  deep:{ go:"<b>深入目标：把「能抓到数据」升级为「抓得稳、抓得合规」</b>。深入 HTTP 协议细节：请求头、状态码语义、Cookie/Session 机制；工程化设计超时、重试、频控；了解 robots.txt 与爬虫的法律边界。<b>深入标志：遇到 403/429 知道完整的排查路径而不是换网站。</b>", tasks:["抓一个公开 API，脚本必须带：超时、失败重试、UA 伪装、限速，结果落 CSV","给脚本补全异常处理：网络错误、JSON 解析失败、空响应分别兜底","把通用逻辑抽成可复用的 fetch 函数（参数化 URL 与字段映射）","写一次完整调试记录：从报错到定位到解决"] }
},
"s0_7":{
  intro:"数据环境几乎全是 Linux 服务器，你不会 Linux 就没法自己部署、排查、看日志。这是工程岗的日常语言，不是可选项。",
  pts:[
    "<b>文件与目录</b>：ls -lh / cd / pwd / mkdir -p / cp / mv / rm -rf（慎用！）/ find / grep 组合使用",
    "<b>权限体系</b>：chmod 754 的含义（所有者 rwx、组 rx、其他 x），ll 输出第一列的解释",
    "<b>管道与重定向</b>：| 管道把前一个输出给后一个（ps aux | grep java）；&gt; 覆盖写、&gt;&gt; 追加、2&gt;&amp;1 合并错误输出",
    "<b>进程与端口</b>：ps -ef / top / netstat -tlnp 或 ss -tlnp（看端口占用）、kill 与 kill -9 的区别",
    "<b>日志排查套路</b>：tail -f 实时看、grep -n 'ERROR' app.log | head -50、awk '{print $1}' 取列",
    "<b>Shell 脚本</b>：#!/bin/bash 开头、变量、if 判断、for 循环、crontab -e 定时执行——调度任务的基础",
    "<b>压缩与传输</b>：tar -zxvf、scp 传文件、vim 的三种模式（i 编辑 / Esc 命令 / :wq 保存）"
  ],
  pit:"最危险的三个命令：rm -rf、sudo 乱用、kill -9 乱杀。第一次在服务器上操作前，先备份，或者先在本地虚拟机/容器里练熟。",
  quiz:["查看 8080 端口被哪个进程占用，命令是什么？","如何实时监控一个日志文件的新增内容？","crontab 里 '0 2 * * *' 表示什么时间执行？"], ans:["lsof -i:8080 或 ss -tunlp | grep 8080（推荐 ss，更快），也可用 netstat -tunlp | grep 8080；拿到 PID 后 kill -9 <PID>，看详情用 ps -ef | grep <PID>。记不住就记 lsof -i:端口号 这一条。","tail -f app.log 实时跟随；只看关键字用 tail -f app.log | grep --line-buffered ERROR；多文件用 tail -f a.log b.log。区别：tail -F 会在日志切割（logrotate）后自动重开新文件，长期监控用 -F 更稳。","每天凌晨 2:00 执行。crontab 五段依次是：<b>分 时 日 月 周</b>。常见：*/5 * * * * 每 5 分钟；0 0 * * 1 每周一零点；0 1 1 * * 每月 1 号 1 点。两个坑：cron 的 PATH 很精简，脚本里用绝对路径；记得把输出重定向到日志文件便于排查。"],
  res:"《鸟哥的 Linux 私房菜》基础篇挑核心章节；或者直接在自己电脑装个 WSL/虚拟机实操，比看书快 10 倍",
  deep:{ go:"<b>深入目标：从「会敲命令」到「懂进程与文件系统」</b>。理解管道与重定向的原理、ps/top/df/du/grep/awk 的组合排查套路、crontab 五段式语法、Linux 权限模型。<b>深入标志：服务挂了，能按「进程 → 端口 → 日志 → 磁盘」四步法独立排查。</b>", tasks:["写一个日志分析脚本：用 awk 统计访问量 Top10 的 IP 并输出 CSV","用 crontab 给自己搭一个每日数据库备份任务并验证恢复","模拟一次「磁盘满了」故障：df -h 定位、找出大文件、安全清理","整理 30 条最常用命令速查卡（含一个真实使用场景）"] }
},
"s0_8":{
  intro:"Git 是代码协作的'存档系统'。你的项目、简历上的 GitHub 链接、未来公司的代码仓库，全靠它。核心就三个动作：存、取、同步。",
  pts:[
    "<b>工作区三态</b>：工作区（改文件）→ git add 暂存区 → git commit 本地仓库 → git push 远程仓库；git status 永远先看它",
    "<b>提交信息规范</b>：feat: 新功能 / fix: 修 bug / docs: 文档 / refactor: 重构 + 一句话说明，如 'feat: 添加用户留存计算任务'",
    "<b>分支模型</b>：git branch / checkout / merge；日常开发在 feature 分支，合回主分支用 PR（pull request）",
    "<b>撤销的艺术</b>：git log 看历史、git reset 与 git revert 的区别（reset 是回退本地、revert 是反做一次提交）、git stash 暂存未完成的工作",
    "<b>远程协作</b>：git clone / pull / push；冲突（conflict）出现时别慌：&lt;&lt;&lt;&lt;&lt;&lt;&lt; 标记里手动保留正确内容再提交",
    "<b>README 与仓库形象</b>：项目 README 写清楚：项目是什么、怎么跑、架构图、目录结构——面试官看你的 GitHub 就是在看这个"
  ],
  pit:"最容易翻车的是：git add . 把不该提交的文件（密码、大数据文件）提交了。养成写 .gitignore 的习惯（Python 项目至少忽略 __pycache__ 和 .env）。",
  quiz:["提交后发现写错了想改提交信息，用什么命令？","pull 时遇到冲突怎么处理？","如何把本地已有项目推到 GitHub 新建仓库？"], ans:["未推送时用 <b>git commit --amend -m '新信息'</b>。已推送到远端就<b>不要</b> amend（会改写历史、坑队友），改用新提交修正。改更早的提交：git rebase -i HEAD~n，把对应行改成 reword。","git pull 报冲突 → git status 看冲突文件 → 打开手工选择保留内容（删掉 &lt;&lt;&lt;&lt;&lt;&lt;&lt; / ======= / &gt;&gt;&gt;&gt;&gt;&gt;&gt; 标记）→ git add <file> → git commit 完成合并。想快速取舍用 git checkout --ours/--theirs <file>。铁律：<b>已推送且他人在用的分支，不要 rebase</b>。","git init && git add . && git commit -m 'init' && git remote add origin git@github.com:user/repo.git && git branch -M main && git push -u origin main。要点：先在 GitHub 建<b>空仓库</b>（别勾 README，否则要先 pull）；推送前写好 .gitignore，别把密钥和虚拟环境传上去。"],
  res:"廖雪峰 Git 教程（免费）快速过一遍 + 每天练习：所有项目代码都推到 GitHub",
  deep:{ go:"<b>深入目标：理解 Git 的版本模型而不是背命令</b>。理解 commit 是快照、分支只是指针；分清 merge 与 rebase 的本质区别与团队规范；掌握冲突解决与 reflog 找回。<b>深入标志：团队协作中敢用 rebase，并知道什么时候不该用。</b>", tasks:["画一张 commit DAG 图，解释一次 rebase 前后指针的变化","故意制造一次冲突并解决，把过程记录下来","给项目 0 写一个规范 PR：描述、改动点、自测清单","用 git reflog 演练一次「reset 错了怎么找回提交」"] }

  quiz:["你的清洗规则能逐条说清理由吗？（每条规则都能答'为什么'）","你的结论有数据支撑吗？把'结论→证据'链路写出来","README 能让一个陌生人按步骤复现你的项目吗？"], ans:["合格标准：每条规则都能回答「不这么做会怎样」。例：去重 → 上游重复上报会导致 GMV 翻倍；空值填充 → 该字段下游做分母，不能为 0。答不上理由的规则要么补理由，要么删掉——<b>说不清理由的清洗规则是隐患</b>。","合格写法：结论（一句话）→ 支撑数据（具体数字 + 口径 + 时间范围）→ 数据来源（哪张表、哪段 SQL）→ 替代解释与排除过程。反例：「用户活跃下降明显」——没数字、没口径、不可验证。","自检方法：把仓库 clone 到全新目录（或请同学操作），严格按 README 一步步做，任何卡住的地方都是 README 的缺陷。必备四块：项目是什么（一段话）、怎么跑起来（命令）、输入输出示例、已知问题与踩坑。"],

"s1_1":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_0 维度建模</b>——分层是把模型按职责摆进楼层，模型是楼的地基。</span>数仓分层是把'原始数据'加工成'业务可用数据'的过程规范化。每层有明确职责，层层递进。面试必问'你们数仓怎么分层'。",
  pts:[
    "<b>ODS（贴源层）</b>：原样存储业务库/日志数据，与源保持一致，只做格式统一，不做业务加工——它是数据仓库的'水龙头'",
    "<b>DWD（明细层）</b>：清洗、去重、标准化（统一编码、统一单位）、维度退化，生成干净的明细数据；这一层质量决定上层质量",

    "<b>ADS（应用层）</b>：面向具体报表/分析的最终结果表，数据量最小、直接供 BI 和业务查询",

  pit:"别把 DWD 当 ODS 的复制，也别跳过 DWS 直接在 DWD 上跑十几个报表任务（那就是在重复计算，且口径没法统一）。分层清晰度是面试官评估你工程素养的第一印象。",
  quiz:["ODS 和 DWD 的本质区别是什么？","为什么要在 DWS 做汇总而不是让每张报表自己算？","日增量表（_di）和全量表（_df）各自适用什么场景？"], ans:["ODS 是<b>贴源</b>：结构与源系统几乎一致，保留原始字段便于溯源和排查问题；DWD 是<b>清洗后的明细层</b>：去重、空值处理、枚举统一、字段标准化、维度退化，口径统一后可被下游放心复用。一句话：ODS 回答「源系统原来是什么」，DWD 回答「统一口径的明细是什么」。","避免同一指标被 N 张报表重复计算（口径不一致 + 重复消耗算力）。DWS 按主题域做轻度汇总（如「用户日粒度活跃表」），ADS 直接取用，实现<b>一处定义、多处复用</b>——这就是数仓存在的价值，也是面试讲分层设计时的核心论点。","_di（日增量）适合大表且只需新增/变更数据的场景（订单表每天只同步当天），省存储省算力，取全量要按分区 UNION 或建全量视图；_df（全量）适合小表或需要随时取全量快照的维表，每天全量覆盖、简单直接但存储开销大。工程折中：小表全量、大表增量 + 定期全量校验。"],

    "<b>核心抽象 RDD/DataFrame</b>：数据被切分成多个分区（partition），并行分布在多台机器上；DataFrame 带 schema 和优化器（Catalyst），比 RDD 高效且是主流写法",
    "<b>宽依赖 vs 窄依赖</b>：窄依赖每个分区只被一个父分区使用（map/filter，可流水线）；宽依赖需要 shuffle（groupBy/join/distinct），数据跨节点传输，最贵",
    "<b>Shuffle 是万恶之源</b>：多数性能问题的根源。少 shuffle 的方法：提前过滤（pushdown）、用广播变量（小表广播，避免大 join 的 shuffle）",
    "<b>数据倾斜</b>：某个 key 数据量特别大（如'北京'占 80%），导致单个任务拖垮整个作业。解法：加盐拆分、两阶段聚合（先局部聚合再加盐 key 二次聚合）、过滤异常 key、调整并行度",
    "<b>三大算子族</b>：转换（transformation，懒执行，只是记录血缘）、行动（action，如 collect/count/write，触发真正计算）、持久化（cache/persist，重复使用的中间结果）",
    "<b>调优三板斧</b>：① 减少 shuffle 数据量（过滤、列裁剪）→ ② 解决倾斜（加盐/广播）→ ③ 合理资源（executor 内存/核数、并行度）",
    "<b>Spark SQL</b>：写 SQL 自动转成 Spark 作业，日常 80% 场景用 Spark SQL 就够，PySpark 用来写复杂逻辑"
  ],
  pit:"常见错误：把 PySpark 当 pandas 写（collect 到本地再处理，数据量一大直接 OOM）；不知道懒执行（写了半天转换没触发，没报错也没执行）；遇倾斜就加资源（治标不治本）。",
  quiz:["什么操作会触发 shuffle？举三个","数据倾斜的表现是什么？加盐解决倾斜的原理是什么？","cache 和 checkpoint 有什么区别？",
  "【场景题】一个 Spark 任务处理 1TB 数据很慢：大量 task 卡在 Shuffle Read，个别 Executor 频繁 OOM。给出排查思路与优化方向。"], ans:["触发 shuffle 的典型操作：groupByKey/reduceByKey、join、repartition、distinct、orderBy/sortBy、窗口函数（PARTITION BY）。共同点：<b>需要把相同 key 的数据重新聚到一起</b>，必然跨节点重分布。优化要点：reduceByKey 会先本地聚合，比 groupByKey 快得多。","表现：绝大多数 task 秒完，个别 task 跑几十分钟或 OOM，Spark UI 里某个 task 的 shuffle read 是其他的上百倍。加盐原理：给倾斜 key 加随机前缀（key → key_0~key_9）打散到多个 task 处理，聚合后再去前缀二次聚合，代价是多一轮聚合计算。","cache/persist 把数据缓存到内存/磁盘加速复用，<b>血统（lineage）仍保留</b>，缓存丢失可重算；checkpoint 把数据物化到可靠存储（HDFS）并<b>切断血统</b>，适合血统很长、迭代计算的场景，代价是要额外跑一次作业。",
  "按「先定位、再对症」讲：<b>定位</b>：Spark UI → Stage 详情看是否有<b>数据倾斜</b>（个别 task 输入远超中位数），确认倾斜 key。<b>优化</b>：① 倾斜 → 加盐两阶段聚合 / 按更均匀键 repartition / 调 spark.sql.shuffle.partitions；② 内存 → 增大 Executor 内存、开 off-heap、小表 broadcast（Broadcast Join 免 shuffle）；③ 减 shuffle → 尽早过滤（pushdown）、列裁剪、开压缩。加分句：「先看数据分布再动手，不盲目加资源」。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>为什么广播小表能避免 shuffle？加盐后结果如何还原？（答：广播后 join 本地完成；先按 (salt,key) 聚合再按 key 去 salt 合并）</div>"],
  res:"官方 Quick Start + 尚硅谷/极客时间的 Spark 课程选一套跟完；重点亲手制造一次数据倾斜再解决它",
  deep:{ go:"<b>深入目标：理解 Spark 的执行模型而不只是会调 API</b>。宽窄依赖的区别与 shuffle 触发点、shuffle 的物理过程、数据倾斜的定位（Spark UI）与打散方案、分区与并行度设置。<b>深入标志：任务跑得慢，能从 Spark UI 定位到具体 stage 并说清瓶颈类型。</b>", tasks:["人为制造一次数据倾斜，用加盐打散方案解决，记录前后耗时","对比 cache / 不 cache / checkpoint 三种情况的执行计划差异","读懂 Spark UI 的 stage/task/shuffle 读写量指标，截图做笔记","把一个熟悉的 pandas 脚本改写成 PySpark，对比写法差异"] }
},
"s1_3":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s0_0 SQL 基础 + s1_1 数仓分层</b>——HiveQL 就是跑在分层表上的 SQL。</span>Hive 是把 SQL 翻译成 MapReduce/Spark 作业的数仓工具，离线数仓的'标准 SQL 入口'。你的数仓任务 80% 是 Hive/Spark SQL。",
  pts:[
    "<b>Hive 本质</b>：元数据（表结构）存在 MySQL，数据存在 HDFS；你写 SQL，它编译成分布式作业——理解'SQL 是外壳，底层是分布式计算'",
    "<b>分区表</b>：按 dt 等字段分目录，查询时只扫对应分区，避免全表扫描；这是 Hive 性能第一要素——一定要建分区表，查的时候一定要带分区条件",
    "<b>分桶表</b>：按某列哈希分文件，利于抽样和 bucket join，比分区更细粒度；面试常考概念",
    "<b>文件格式</b>：TextFile（可读但大）、Parquet / ORC（列式压缩，性能好得多，主流选择）",
    "<b>常用调优</b>：① 小文件合并（小文件多会拖垮 NameNode 和任务调度）；② 合理设置 map/reduce 数；③ 数据倾斜时开倾斜优化或手动加盐；④ 能用中间表减少重复计算",
    "<b>严格模式</b>：分区表查询不带分区条件会报错，防止全表扫描——这其实是保护你的",
    "<b>Hive vs Spark SQL</b>：Hive on MR 慢，Hive on Spark/Tez 快；现在很多公司直接用 Spark SQL 替代 Hive 执行引擎，但表结构、分区思想完全一样"
  ],
  pit:"最典型的坑：全表扫描（忘了带分区条件）、小文件爆炸（每批数据生成几百个小文件）、在 TextFile 大表上反复查。先养成'查表先看分区、写完先看执行计划'的习惯。",
  quiz:["为什么分区表查询性能远高于非分区表？","Parquet 比 TextFile 好在哪？","建表时忘记指定分区，后期还能加吗？有什么代价？"], ans:["分区在 HDFS 上是<b>目录级隔离</b>，查询带分区条件时可直接跳过无关目录（分区裁剪），大幅减少扫描量。三个要点：查询必须带分区字段才生效；分区粒度要合理（通常按天）；太细会产生大量小文件，反而拖慢。","Parquet 是<b>列式存储</b>：同列数据物理连续 → 压缩率高（同类型相似度高）、可列裁剪（只读需要的列）、自带 schema 与统计信息（支持谓词下推）。TextFile 是行式纯文本，无压缩无 schema，读取必须全量解析。数仓中间层默认用 Parquet/ORC。","技术上能加，但要<b>重写全部历史数据</b>（新建分区表 + INSERT OVERWRITE 导入），数据量大时非常耗时耗资源。所以建表前必须想清楚分区键——这是 Hive 建表最常见的返工点，也是面试里「你踩过什么坑」的好素材。"],
  res:"在本地 Docker 里起一个 Hive/Spark 环境，亲手建表、分区、load 数据",
  deep:{ go:"<b>深入目标：掌握 Hive 的存储与执行原理</b>。HiveSQL 到 MapReduce/Tez 的翻译关系、分区裁剪与分桶的存储原理、Hive 场景的数据倾斜解法（mapjoin、倾斜键拆分）。<b>深入标志：每次建表都能主动说清为什么这样分区、查询能不能裁剪到分区。</b>", tasks:["项目 1 的 Hive 表全部设计分区，用 EXPLAIN 验证分区裁剪生效","做一次分桶表与普通表 JOIN 的对照实验","收集 5 个最常用的 Hive 调优参数，逐个实验并记录效果","写一页《Hive 建表规范》给未来的自己"] }
},
"s1_4":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_2 PySpark ETL（或 s1_3 Hive）</b>——有了要定时跑的链路，才需要调度。</span>调度与数据同步是数仓的'时钟和血管'：任务什么时候跑、跑完怎么通知下一个、数据怎么搬进数仓。没有它们，你的数仓只是静态的建表脚本。",
  pts:[
    "<b>工作流调度</b>：DolphinScheduler（国产开源，国内公司多）或 Airflow（国际主流）：把任务组织成 DAG（有向无环图），定义依赖关系",
    "<b>核心概念</b>：任务（Task）/ 工作流（Workflow/DAG）、依赖（上游跑完才跑下游）、调度周期（小时/天/周）、重跑机制（失败重试、补数据 run 某一天）",
    "<b>数据同步 DataX</b>：异构数据源搬运（MySQL→Hive、Oracle→HDFS），支持全量和增量；增量同步常用 max(id) 或时间戳水位线",
    "<b>调度时间陷阱</b>：T+1 任务的调度时间（凌晨 2 点跑昨天数据）；分区时间参数（dt=$bizdate 这种动态传参）",
    "<b>幂等性</b>：同一任务重复跑，结果必须一致——写任务时先 DELETE 目标分区再写，保证可重跑；这是数据工程师的职业素养",
    "<b>监控与告警</b>：任务失败告警、数据量波动监控（今天比昨天少 90% 必须报警）、SLA 保障",
    "<b>依赖数据上游</b>：上游表任务完成才触发（跨团队任务依赖用'表依赖'而非'时间依赖'，防止上游延迟导致下游算错）"
  ],
  pit:"最常见的生产事故：任务重跑没清分区（重复数据）、调度时间没用业务日期（跨天数据错位）、上游还没跑完下游就开始算（数据不全）。写调度先想：'这个任务跑 10 遍结果都一样吗？'",
  quiz:["什么是任务的幂等性？你的 ETL 任务怎么保证？","为什么下游应该依赖'表就绪'而不是'时间到了'？","增量同步和全量同步分别适合什么场景？"], ans:["幂等 = 同样输入跑多次，结果与跑一次完全相同（不产生重复数据）。保证方式：① 分区覆盖写 INSERT OVERWRITE TABLE ... PARTITION(dt='xxx') ② 同事务内先删再插 ③ 按主键 UPSERT。核心原则：<b>不要用 append 而不做去重</b>。","上游任务可能延迟或失败，按固定时间调度会让下游读到空表或半成品数据（脏数据）。正确做法是<b>基于数据依赖触发</b>（上游分区产出完成才跑下游），时间调度只作为兜底。这是调度系统里「表就绪探测」的意义。","增量适合：数据量大、有可靠的变更时间字段（update_time）、上游支持按时间过滤；全量适合：表小、无可靠时间字段、需要捕获删除（物理删除在增量里抓不到）。工程常见折中：小表全量、大表增量 + 定期全量校验。"],
  res:"DolphinScheduler 官方文档快速上手，把自己的项目 1 编排成 5 个以上任务的 DAG",
  deep:{ go:"<b>深入目标：建立调度系统的工程语义</b>。DAG 依赖设计、任务幂等性（重跑不产生脏数据）、指定日期回补（backfill）、失败重试与告警的分级设计。<b>深入标志：任何任务失败后，能放心地一键重跑。</b>", tasks:["用 Airflow 或 DolphinScheduler 把项目 1 全链路编排起来","演练一次「补 3 天前的历史数据」，验证幂等性","给核心任务配置失败告警（邮件/webhook），并演练误报处理","写一份幂等性检查清单：分区覆盖写、去重键、幂等写入方式"] }
},
"s1_5":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_1 数仓分层</b>——OLAP 引擎是分层架构里的查询层，先有分层才有查询对象。</span>OLAP 引擎解决'分析查询快'的问题。数仓加工完的数据要支撑 BI 报表、自助分析，MySQL 扛不住大查询，就需要专门的分析型引擎。",
  pts:[
    "<b>OLTP vs OLAP</b>：OLTP（MySQL，事务处理，写多查少，行存）；OLAP（分析处理，查多写少，列存+向量化，查询快 10-100 倍）",
    "<b>Doris / StarRocks / ClickHouse 三选一</b>：Doris（百度开源，国内互联网用得多，语法像 MySQL）；StarRocks（Doris 的分支，性能更激进）；ClickHouse（俄罗斯开源，单机性能极强但生态和 join 较弱）",
    "<b>列式存储原理</b>：按列存储+压缩（同一列数据类型一致，压缩率高）+ 向量化执行（一次处理一批数据而非一行），这是 OLAP 快的根本",
    "<b>物化视图 / 预聚合</b>：把高频查询的聚合结果预先算好存起来，查询直接读结果；Rollup/聚合模型是 Doris 家族的核心玩法",
    "<b>建模模型</b>：Doris 的 Aggregate/Unique/Duplicate 模型——对应'要汇总''要更新''要明细'三种场景",
    "<b>查询优化</b>：分区裁剪、分桶裁剪、前缀索引、bitmap 精确去重（count(distinct) 在亿级数据下很慢，用 RoaringBitmap）"
  ],
  pit:"选型错误很致命：拿 ClickHouse 做需要频繁 JOIN 的场景、拿 Doris 当 MySQL 用（不支持事务/更新频繁）。选引擎前先想清楚：查询模式是什么？并发多高？要实时更新吗？",
  quiz:["列式存储为什么压缩率高、查询快？","count(distinct) 在超大数据量下为什么慢？有什么替代方案？","什么场景适合用 OLAP 引擎，什么场景不适合？"], ans:["压缩高：同列数据类型一致、相似度大，字典编码/RLE 效果好；查询快：只读取涉及的列（列裁剪），按列连续读取利于顺序 IO 与向量化执行。代价：单行写入/更新相对行存麻烦，不适合高频点查。","需要维护全局去重集合（内存随基数增长），且难以完全并行（各节点去重后还要合并）。替代方案：① 近似算法 HyperLogLog（误差约 1%，性能数量级提升，ClickHouse 的 uniq 就是）② 预聚合到更粗粒度 ③ 基数不大时用 bitmap。","适合：海量数据聚合分析、多维钻取、宽表少列查询、即席查询（看板、自助分析）。不适合：高并发单行点查、强事务（转账类）、频繁更新的 OLTP。一句话区分：OLAP 为「读多写少、聚合为主」，MySQL 为「事务一致性」。"],
  res:"Doris 官方文档'快速开始'在本地 Docker 跑起来，把项目 1 的 ADS 表导入 Doris 试查询",
  deep:{ go:"<b>深入目标：理解列存与 MPP 架构的本质优势</b>。为什么列存适合聚合、Doris/ClickHouse 的分区分桶键如何决定查询性能、物化视图与预聚合的取舍。<b>深入标志：看到一条查询，能预判它该走明细还是预聚合、快慢在哪里。</b>", tasks:["同一份数据导入 ClickHouse 或 Doris，跑 5 条典型查询与 MySQL 对比耗时","为你的数据设计分区分桶键，写出选择理由","用物化视图/预聚合把最慢的一条查询优化 10 倍","写一篇 ClickHouse vs Doris vs MySQL 的选型对比笔记"] }
},
"s1_6":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_0 维度建模 ~ s1_5 OLAP 全部任务</b>——项目 1 是 S1 的综合大作业，零件全齐才能组装。</span>项目 1 是你的主力项目，决定你能否拿到实习面试。它必须完整覆盖：采集→ODS→DWD→DWS→ADS→调度→BI，且你能讲清每一步的'为什么'。",
  pts:[
    "<b>业务域选择</b>：推荐电商交易（下单-支付-退款链路清晰）或内容播放（曝光-点击-播放）。你自己最熟悉的业务是最好的，因为能讲清业务逻辑",
    "<b>数据从哪里来</b>：构造/模拟数据 + 公开数据集均可，关键是'自洽'：字段要能支撑你的业务过程（订单表要有用户、商品、金额、时间、状态）",
    "<b>架构落地</b>：MySQL 模拟业务库 → DataX 同步到 Hive/Doris → DWD 清洗标准化 → DWS 按用户/商品/天汇总 → ADS 输出报表口径 → DolphinScheduler 编排 → BI 工具出看板",
    "<b>指标设计</b>：至少 8-10 个指标：GMV、订单量、客单价、转化率、复购率、留存、Top 商品、渠道分布",
    "<b>讲故事的素材</b>：每个环节留一个'踩坑-解决'案例（如：某天数据翻倍，排查发现是重复同步；某表倾斜，加盐解决），面试讲这些比背概念强 100 倍",
    "<b>文档要求</b>：数据字典（每张表、每个字段含义）、分层设计文档（为什么这么分层）、架构图（draw.io/ProcessOn 画）",
    "<b>性能与治理意识</b>：哪怕数据量小，也要展示：分区表、压缩格式、调度监控、失败重跑逻辑——面试官看的是'工程习惯'不是数据量"
  ],
  pit:"最大坑：只贴代码不写文档，或者照抄教程项目（换了个表名）。面试官追问两个'为什么'就穿帮的项目，不如不做。真实感 = 讲得出取舍和踩坑。",

      tasks:["全链路跑通并录屏留档（防演示翻车）","每个环节写一条「设计决策 + 备选方案 + 选择理由」","数据量放大 10 倍压测，找到瓶颈并优化，记录前后对比","完成项目文档三件套：数据字典 + 分层设计 + 指标口径"] }

  quiz:["你项目里 ADS 层'每日 GMV'的字段口径，能否一句话说清？","新同学拿到你的文档，能否 30 分钟内看懂架构并跑通？","你的 DDL 里每张表、每个关键字段都有 COMMENT 吗？"], ans:["合格表述要包含<b>业务定义 + 计算规则 + 边界条件</b>，例：「某自然日已支付订单的金额总和，剔除退款订单、不含运费，按支付时间归属」。不合格：「GMV 就是成交额」——没说剔除项、没说时间归属。口径三要素缺一不可。","这是文档质量的硬指标。自检五件套：架构图 + 数据流向 + 表清单 + 一个可跑的示例 SQL + 常见报错处理。最直接的办法是请一位同学盲测，他卡住的地方就是文档缺口，别自己读自己写的。","合格标准：每张表有 COMMENT（说明用途），关键字段有 COMMENT（枚举值要写明：1-男 2-女 9-未知），分区字段说明粒度（dt：按天分区，yyyy-MM-dd）。<b>字段注释缺失是数仓协作最大的隐性成本</b>，也是代码 review 常被忽略的一项。"],

"s2_0":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>S1 阶段（尤其 s1_2 PySpark ETL）</b>——语料清洗就是 ETL 思路换了个对象。</span>语料工程是 AI 数据方向的核心技能：把互联网/业务数据变成大模型能'吃'的高质量文本。这是 2026 年最缺人的细分方向之一。",

  ],
  pit:"别把语料工程理解成'洗数据'这么简单——它的核心是质量评估体系：你怎么定义'好数据'？用什么指标衡量？这是面试官会深挖的问题。",
  quiz:["训练语料为什么要去重？近似去重和精确去重的区别？","你怎么评估一批语料的质量？列出至少 4 个维度","为什么数据配比影响模型能力？举一个配比失衡的例子"], ans:["重复语料会让模型过拟合重复模式、浪费算力，还可能导致复读机式输出。<b>精确去重</b>：用 hash（如 MD5）去掉完全相同的文本；<b>近似去重</b>：用 simhash / minhash / embedding 相似度去掉「几乎一样」的文本（如同一文章被多站点转载的微小改动版）。","常用维度：① 准确性（事实错误率）② 完整性（是否截断、缺段）③ 一致性（格式与术语是否统一）④ 时效性（是否过期，技术文档尤其重要）⑤ 多样性（来源/领域/长度分布）⑥ 合规性（敏感信息、版权）。工程做法：抽样 100 条人工标注，用来校准自动打分规则。","配比失衡会让模型偏向高频领域、冷门领域能力塌方。例：语料中 90% 是网页文本、代码只占 1%，写代码能力就差；数学/推理数据太少，逻辑题就差。这也是为什么<b>高质量小数据</b>（精心构造的数学题、指令数据）能显著提升特定能力。"],

"s2_1":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s2_0 语料工程</b>——向量库里装的是清洗好的语料，垃圾进垃圾出。</span>embedding 把文本变成向量（一串数字），向量库让'按语义找内容'成为可能。这是 RAG 和一切语义检索的地基。",
  pts:[
    "<b>embedding 是什么</b>：把'苹果'变成 [0.1, -0.3, ...] 这样的高维向量，语义相近的文本向量距离近（余弦相似度高）",
    "<b>为什么要向量</b>：关键词搜索（BM25）只能字面匹配；向量检索能理解同义与语义（'怎么退单'和'取消订单'匹配）",
    "<b>向量库选型</b>：Milvus（开源、功能全、生产级）、pgvector（PostgreSQL 插件，小项目够用）、FAISS（库而非数据库，最轻）",
    "<b>核心流程</b>：文档切块（chunk，一般 200-500 token 带重叠）→ 调 embedding 模型转向量 → 入库（带元数据）→ 查询时把问题也转向量 → 相似度检索 TopK",
    "<b>切块策略</b>：按段落/语义切分，块太小丢失上下文、太大检索不精准；重叠窗口保持边界信息",
    "<b>相似度度量</b>：余弦相似度、内积、欧氏距离——不同 embedding 模型配不同的度量",
    "<b>评估检索效果</b>：召回率、命中率（golden set：准备一批'问题→正确文档'对，测 TopK 是否命中）"

  pit:"常见坑：文档不切块整篇入库（检索等于全文匹配）、向量库和模型不匹配（用 A 模型向量喂 B 模型检索）、不做效果评估就上线（'感觉差不多'不可靠）。",
  quiz:["为什么切块大小影响检索效果？太小和太大各有什么问题？","cosine 相似度的取值范围？什么情况表示完全无关？","你如何验证你的检索系统是'好'的？"], ans:["太小 → 语义被切断（一句话被拆开）、上下文不足，检索到碎片无法回答；太大 → 一个 chunk 含多个主题，向量被「平均化」失去焦点，命中率低且浪费 token。工程做法：<b>按语义/段落切而非死板按字数</b>，加 overlap 保留跨块上下文，多试几组用测试集评估。","余弦相似度取值 <b>[-1, 1]</b>：1 同向（最相似），0 正交（线性无关，语义上可视为无关），-1 完全反向（实际 embedding 中极少见）。注意不同模型、不同归一化方式下数值分布不同，<b>阈值必须靠实验定</b>，不能照搬网上的 0.8。","先建测试集：N 条 query + 人工标注的相关文档（ground truth），再用指标量化：<b>Recall@K</b>（正确文档出现在前 K 个结果中的比例）、<b>MRR</b>（首个正确结果排名倒数的均值）、<b>NDCG</b>（考虑排序位置）。先有测试集再谈优化，否则调参就是玄学。"],
  res:"用 OpenAI/本地模型 API 把 100 篇文章向量化存入 pgvector，写一个检索 Demo",
  deep:{ go:"<b>深入目标：理解向量检索的原理与调参</b>。embedding 为什么能表达语义相似、HNSW/IVF 索引的原理与取舍、召回率与检索速度的权衡。<b>深入标志：能设计实验验证「语义相近的句子向量距离更近」，并量化不同模型的效果差异。</b>", tasks:["跑通 Milvus 或 pgvector 的入库 + 检索全流程","用同一批数据对比 2-3 个 embedding 模型的检索效果","调整索引参数（如 ef/nprobe），画出召回率-速度曲线","写实验报告：模型选型结论 + 理由"] }

"s2_2":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s2_1 embedding + 向量库</b>——RAG 检索链路建立在语义索引之上。</span>RAG（检索增强生成）是 2026 年最主流的大模型落地方式：不重新训练模型，而是把知识库内容检索出来喂给大模型回答。你做的知识库问答就是它。",
  pts:[
    "<b>RAG 三阶段</b>：索引（文档→切块→向量化→入库）→ 检索（问题→向量化→TopK 召回）→ 生成（问题+上下文→大模型→回答）",
    "<b>为什么 RAG 而不是微调</b>：知识更新快（改库即可）、可溯源（答案带来源）、省成本（不用训练）；微调适合改'说话风格/格式'，不适合塞知识",
    "<b>检索质量决定上限</b>：召回不相关的上下文，模型再强也答错。所以工程重心在索引和检索，不在提示词",
    "<b>重排（Rerank）</b>：粗召回 Top50 → 用 rerank 模型精排 Top5，显著提升精度",
    "<b>上下文拼接</b>：给模型的 prompt 结构：系统指令 + 检索到的文档 + 问题 + 输出要求；限定'只基于给定内容回答'防止幻觉",
    "<b>评估体系</b>：忠实度（答案是否基于文档）、相关性（检索是否命中）、答案质量（完整/准确）——用人工或 LLM 打分",
    "<b>进阶</b>：混合检索（BM25 + 向量）、query 改写（问题口语化先改写再检索）、多跳检索（先查 A 再查 B）"
  ],
  pit:"最大坑：把 RAG 做成'高级搜索框'——没有评估、没有溯源、没处理'检索不到'的兜底。面试被问'你的 RAG 效果怎么衡量'答不上来，项目就白做了。",
  quiz:["为什么说'检索质量决定 RAG 效果的上限'？","怎么减少大模型基于检索内容'编造'答案？","检索 TopK 选 5 还是 50？为什么需要重排？"], ans:["因为生成模型只能基于检索到的上下文作答，<b>正确的知识没被召回时，再强的模型也只能编</b>。RAG 失败案例中绝大多数是召回问题（切片不合理、TopK 太小、缺查询改写），而不是生成能力问题。所以优化优先级永远是：检索 > 生成。","① prompt 明确约束「只依据给定上下文回答，无依据就说不知道」② 要求给出引用来源（chunk id 或原文片段），可溯源便于核验 ③ 提高检索质量（治本）④ 后处理校验：答案关键实体是否出现在上下文中。核心思路：<b>让模型有据可依，并给它「无法回答」的出口</b>。","直接喂 50 条会让 prompt 过长、噪声增多（中间信息容易被忽略，即 lost in the middle），成本也高。常规做法：<b>先大 K 召回（如 50，保证召回率），再用 rerank 精排取 Top 3-5 交给生成</b>——两阶段：召回求全、重排求准。"],
  res:"官方 RAG 教程/开源项目（LangChain 或 LlamaIndex 快速上手）搭一个知识库问答，写清楚评估方法",
  deep:{ go:"<b>深入目标：掌握 RAG 链路中「检索质量决定一切」的工程认知</b>。切片策略对效果的影响、混合检索（关键词 + 向量）、rerank 重排、答案溯源引用。<b>深入标志：答非所问时，能定位问题出在切片、检索还是生成环节。</b>", tasks:["搭一个可追问的知识库问答 demo（用项目 1 的数据）","对比三种切片策略（固定长度/按段落/按语义）的问答效果","接入 rerank 模型，对比接入前后的召回质量","建 10 条测试问答集，做成可重复的评估脚本"] }

"s2_3":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_1 数仓分层 + s1_7 交付物文档</b>——治理是把分层与文档做体系化，先有对象再谈治理。</span>数据治理是'让数据可信、可用、可管'的体系化工作，也是各厂高薪刚需岗位。它是你专业里'管理'二字的直接体现。",
  pts:[
    "<b>治理的四大目标</b>：数据质量（准）、数据安全（稳）、数据标准（统一）、数据资产（可用）——能讲清这四个字就有骨架",
    "<b>数据质量六性</b>：完整性、准确性、一致性、及时性、唯一性、有效性——每项都有对应的检查手段（空值率、重复率、波动率）",
    "<b>元数据管理</b>：技术元数据（表结构）+ 业务元数据（口径、含义）——元数据是治理的地基，字段注释写不写就是最基础的治理动作",
    "<b>数据血缘</b>：表与表、字段与字段的依赖关系（A 表被 B 表加工），作用：影响分析（改表先评估影响范围）、问题溯源（数据错了往回查）",
    "<b>指标体系管理</b>：指标口径统一（'用户数'是全站还是活跃？）、指标字典、避免'同一指标不同口径'的混乱",
    "<b>数据安全</b>：分级分类（敏感/一般）、脱敏（手机号打码）、权限管控（最小权限）、合规（个保法：个人信息处理要合法正当必要）",
    "<b>DataOps</b>：治理自动化——质量规则自动检查、异常自动告警、任务自动重跑，'把治理变成流水线'是行业趋势"
  ],
  pit:"别把治理理解成'写规范文档'——治理要落地到工具和规则：质量检查 SQL、血缘解析、自动告警。面试时说'我做了数据治理'，要能举出具体的检查规则和发现的问题。",
  quiz:["数据质量的六个维度是什么？各举一个检查 SQL 的例子","表结构变更前为什么要看血缘？","手机号脱敏一般怎么处理？为什么不能直接删掉？"], ans:["常见六维与检查 SQL：完整性（SELECT COUNT(*) FROM t WHERE id IS NULL）、唯一性（SELECT id,COUNT(*) FROM t GROUP BY id HAVING COUNT(*)>1）、准确性（值域：SELECT COUNT(*) FROM t WHERE age<0 OR age>150）、一致性（跨表金额对账）、及时性（分区产出是否超 SLA）、有效性（枚举值是否在字典内）。","看血缘才能知道改一个字段会波及哪些<b>下游表、任务和报表</b>（影响分析），提前通知相关方、评估改造成本。没有血缘只能全局搜索字段名，极易遗漏，导致下游静默出错——<b>静默错误比报错可怕得多</b>。这是数据治理最基础也最实用的能力。","常见做法：中间四位打星（138****1234）、哈希加盐映射、保留前 3 后 4 用于排查。不能直接删掉：业务仍需联系用户（下单、风控、客服），且可能需要按归属地做统计，删掉会损失可用性。脱敏目标是<b>可用但不可反推</b>。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>如何给「日增量表」设计行数波动告警避免误报？（答：近 7 日均值 ± 3 倍标准差做阈值，节假日单独建模，只对核心表开启）</div>"],
  res:"给你的项目 1 加一套质量检查：空值率、重复率、波动告警，写进调度",
  deep:{ go:"<b>深入目标：建立数据治理的工程抓手</b>。数据质量监控规则（准确性/及时性/唯一性）、血缘的采集方式与影响分析、核心表的 SLA 设计。<b>深入标志：上游要变更时，你能给出受影响表和任务的完整清单。</b>", tasks:["给项目 1 加 3 条质量监控规则（如主键唯一、行数波动阈值）","画出从源到报表的全链路血缘图","给 2 张核心表定义 SLA（时效/质量）并设计违约处理","演练一次「上游改字段」的影响分析，输出评估报告"] }
},
"s2_4":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_6 项目 1 + s2_1/s2_2</b>——项目 2 直接建在项目 1 的数仓之上。</span>项目 2 是你区别于其他候选人的差异化项目：把数仓数据改造成'AI 可检索、可评估、可追溯'的资产。S1 的能力是底座，S2 的知识是翅膀。",
  pts:[
    "<b>核心思路</b>：数据 AI-Ready 化四步：① 元数据语义化（字段注释、业务上下文补全）→ ② 语料化（把结构化数据转成可检索的文本/文档）→ ③ 向量化入库 → ④ 提供检索/问答服务",
    "<b>落地形态</b>：做一个'数仓知识问答'：把指标口径、表结构说明、业务规则做成文档→切块→向量库→RAG，业务同学直接问'上月 GMV 为什么降了'",
    "<b>与项目 1 的关系</b>：项目 2 必须明确回答'这份数据原本在数仓里长什么样，我做了什么让它 AI-Ready'——不能是独立的天外飞仙",
    "<b>工程化要素</b>：增量更新（新表/新文档自动入库）、权限（不同人可问的范围）、日志与评估（哪些问题答不好）",
    "<b>交付物</b>：README（架构图：数仓→语料→向量库→RAG→问答）+ 效果截图 + 评估数据（golden set 命中率）",
    "<b>面试讲法</b>：讲'为什么这么设计'：为什么切块这么切、为什么选这个向量库、检索不准时我做了重排——每个决策都能讲理由"
  ],
  pit:"别做'玩具'：本地几个 txt 塞进向量库就说做了 RAG。要有数据链路、有评估、有增量更新、有踩坑记录——面试官要的是工程化思维。",
  quiz:["你的数据从数仓到 RAG 的全链路是什么？画出来","你的问答效果用什么指标评估？达标线是多少？","新增一份业务文档，系统怎么自动让它可被检索？"], ans:["合格链路：ODS/DWD 表 → 语料化（结构化数据转自然语言文本）→ 清洗去重 → 切片 → embedding → 写入向量库 → 查询时检索 + rerank → 拼 prompt → 生成 → 带引用返回。画出来要标注每步的工具和数据量，这是面试的加分项。","指标三层：① 检索侧 Recall@K ② 生成侧：人工评分（正确性/相关性/完整性 1-5 分）或 LLM-as-judge 辅助打分 ③ 端到端：是否引用正确来源、拒答率是否合理。达标线按场景定（内部知识库常要求正确率 >90%）。关键是<b>有一套可重复跑的测试集</b>。","链路：文档入库（对象存储/文档库）→ 触发解析（PDF/Word 转文本）→ 切片 → embedding → upsert 到向量库（带 doc_id 便于删除更新）→ 刷新索引。工程要点：增量触发（消息队列或定时任务）、失败重试、按内容 hash 做<b>幂等去重</b>防止重复入库。"],
  res:"在项目 1 的数据上完成项目 2，两个项目形成'数仓 + AI 数据'的完整故事线",
  deep:{ go:"<b>深入目标：讲清「AI-Ready 数据链路」与传统数仓的增量</b>。深入语料化（表数据 → 文本化）、向量化、评估集建设三步，把项目 1 和项目 2 串成能力递进故事。<b>深入标志：能用 3 分钟讲清两个项目如何体现「让数据既服务报表也服务 AI」。</b>", tpl:"RAG 项目三件套：① 架构图（数据源→清洗→切分→embedding→向量库→检索→LLM 回答）② 评测表（10 个测试问题 × 检索命中率/回答准确率）③ README 含 demo 截图。量化「准确率从 60% 提到 85%」这类数字最有杀伤力。",
      tasks:["完成数据 → 语料 → 向量库 → 问答的完整链路","建自动化评估：每次改切片/模型都能跑同一套测试集","写项目 2 文档，突出与项目 1 的递进关系","把两个项目的「故事线」写进简历项目描述"] }
},
"s2_5":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_6 项目 1 有实际产出之后</b>——没产出的简历写不出四段式，先做后写。</span>简历是你和面试官的第一次对话，只有 15 秒。数据岗简历的核心：项目经历用'背景-动作-结果-量化'四段式，让面试官能立刻抓住你的能力。",
  pts:[
    "<b>四段式模板</b>：背景（项目解决什么问题）+ 动作（我具体做了什么，用技术名词）+ 结果（数据/业务效果）+ 量化（数字！数字！数字！）",
    "<b>技术栈写法</b>：'熟悉/掌握/精通'要诚实——精通意味着能扛住深挖；把技术栈分：核心（SQL/Spark/建模）+ 了解（Flink/Doris）",
    "<b>动词的力量</b>：'负责/搭建/优化/设计/从 0 到 1'；避免'参与/协助/了解'占主导",
    "<b>项目描述 3-4 行</b>：第 1 行项目定位，第 2-3 行技术实现，第 4 行结果量化；每个项目后列 2-3 个核心技术点",
    "<b>量化的来源</b>：任务数量、数据规模（百万行）、性能提升（查询从 5 分钟到 30 秒）、错误修复数量、覆盖率——没有数字就造场景也要有近似值",
    "<b>一页原则</b>：校招简历一页；教育背景 + 2 个项目 + 技能栈 + 其他（竞赛/证书/GitHub）",
    "<b>投递适配</b>：针对每个岗位微调：JD 要什么就把相关经历往前放、用 JD 里的关键词"
  ],
  pit:"三个致命伤：① 写'熟悉所有大数据组件'（面试官随便挑一个深挖就穿）；② 项目全是教程项目名（一眼假）；③ 没有数字（'提升了性能' vs '查询耗时从 300s 降至 35s'，天壤之别）。",
  quiz:["你的每个项目都能用'背景-动作-结果-量化'写出来吗？","简历上每个技术名词，你都能扛住 3 层追问吗？","你的简历能在一页内讲完你的最强卖点吗？"], ans:["自检四项：背景（为什么做，一句话）→ 动作（我具体做了什么技术动作，用主动动词）→ 结果（产生了什么变化）→ 量化（数字：数据量、性能提升、覆盖用户）。最常缺的是<b>量化</b>——没有数字的经历在简历里几乎没有说服力。","自测方法：对每个关键词连问三次「为什么 / 具体怎么做 / 为什么不用别的」。答不上来的词要么补学，要么降级（「熟悉」改「了解」或直接删掉）。<b>面试官最常用这招识别注水简历</b>，比任何技巧都管用。","自检：把简历给陌生人看 15 秒，让他复述你的卖点——复述得出来就过关。常见问题不是经历少，而是「堆了经历但没提炼」。解法：顶部 2-3 行个人亮点 + 只保留最硬的三段经历，其余一行带过。"],
  res:"写完后发给学长/HR 朋友/我帮你看，收集意见改 3 版；同时用你投递的 JD 反向检查关键词",
  deep:{ go:"<b>深入目标：掌握简历的信息密度原则</b>。每条经历 = 背景 - 动作 - 结果 - 量化；删掉一切经不起追问的形容词。<b>深入标志：任何一条经历被连问三次「所以呢？」，都还有下一层内容。</b>", tasks:["按四段式写完简历 V1","每条经历至少一个量化数字（数据量/效率提升/覆盖范围）","找 3 个人要「15 秒第一印象」反馈并记录","对照 10 份目标岗位 JD，补齐高频关键词（诚实前提）"] }
},
"s2_6":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s2_5 简历 V1 定稿</b>——简历没定稿就海投，是浪费第一批目标公司。</span>投简历不是碰运气，是数据驱动的过程。30 份不是目标，是底线——因为通过率会让你重新认识市场。",
  pts:[
    "<b>渠道分层</b>：① 内推（学长学姐、脉脉、牛客内推帖）命中率最高；② 官网直投（大厂校招官网）；③ 招聘平台（BOSS、实习僧、应届生求职网）；④ 老师/学院资源",
    "<b>时间节奏</b>：暑期实习 3-4 月集中投递（提前批更早）；日常实习全年可投；投递黄金时段：工作日上午",
    "<b>跟进节奏</b>：投递后 3-5 天无回复可礼貌询问；面试后 3 天无消息可发感谢信跟进",
    "<b>失败复盘法</b>：每次被拒记录：哪个环节挂了（简历筛/笔试/一面/二面）、问了什么问题、哪里没答好——这就是你的复习清单",
    "<b>投递矩阵</b>：冲（大厂核心部门）+ 稳（中型公司）+ 保（小厂/外企/银行科技部）三分法，别全押大厂",
    "<b>广撒网与精准投</b>：海投保底量，但对最想去的 5 家公司做'定制版简历 + 作品'",
    "<b>心态管理</b>：被拒是常态不是失败——数据岗校招淘汰率极高，'每被拒一次补一个知识点'的心态让你越挫越强"
  ],
  pit:"别等'准备好了'再投——永远没有准备好的那天。第一次面试大概率挂，但面完你才知道市场要什么。也别海投完就躺平等消息：主动跟进是基本礼仪。",
  quiz:["你这周投了几份？被拒了几次？从每份失败里学到了什么？","你最想去的 3 家公司，JD 里的关键词你简历都覆盖了吗？","你有一个可以随时展示的 GitHub 链接吗？"], ans:["合格标准：有数字（投了几份、笔试几次、面试几次）+ 每个失败的具体缺口归类（知识 / 表达 / 匹配度）。<b>没有复盘的投递只是重复劳动</b>。建议每周固定时间做一次漏斗统计，用数据决定下周补什么。","做法：把目标 JD 复制到文档，标出高频技术要求（SQL、Spark、数仓建模、Python…），逐条对照简历是否有<b>对应证据</b>。缺的不是「编上去」，而是补一个能支撑它的小实践。诚实第一——注水在面试里必被戳穿。","合格标准：链接点开是活的、README 有内容、有图有数据、最近有提交记录。这是最容易被忽视却直接加分的一项；反之，面试官点开看到「大一作业 + 三年没动」是明显减分项。"],
  res:"建一个投递跟踪表（平台笔记区或表格）：公司/岗位/渠道/时间/状态/面试记录",
  deep:{ go:"<b>深入目标：把投递当成数据收集与转化率优化</b>。渠道转化率、拒信复盘、知识点补强的闭环。<b>深入标志：能说出自己的简历通过率、笔试通过率，并针对短板定向改进。</b>", tasks:["建投递追踪表：公司/渠道/状态/结果/复盘","每个拒信做一次缺口复盘，归类到知识/表达/匹配度","每周统计转化漏斗，动态调整投递策略","沉淀 20 个高频面试题的答案并每周演练"] }
},
"s2_7":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>S0 完成后即可随时开始</b>——云平台实操与 S1/S2 并行不冲突。</span>国内数据岗位的战场基本在云上：阿里云市场份额最大，DataWorks（数仓开发平台）+ MaxCompute（计算引擎）是国内数据工程师的日常。",
  pts:[
    "<b>核心组件</b>：MaxCompute（阿里云数仓引擎，兼容 SQL）、DataWorks（开发运维一体化平台：任务开发、调度、数据地图）、OSS（对象存储）、DataHub（实时数据通道）",
    "<b>DataWorks 工作流</b>：数据开发→任务调度→数据质量→数据地图（血缘/元数据）——它就是企业版'你的项目 1'",
    "<b>SQL 兼容性</b>：MaxCompute SQL 与标准 SQL 有差异（分区、类型、函数名），文档常查；学会读官方文档是硬技能",
    "<b>免费实操</b>：阿里云有免费试用额度和开发者认证考试（ACA/ACP）；学生认证后资源更便宜——简历上'阿里云 ACA 认证'是硬通货",
    "<b>云原生思维</b>：不用管服务器（Serverless 化），按量付费；写任务时关注计算量和费用（DataWorks 会显示每个任务的花费）",
    "<b>生态对比</b>：企业还会用腾讯云（EMR/DLC）、华为云、AWS（国外）；会一个云平台后迁移成本不高，核心思想一致",
    "<b>简历加分写法</b>：'基于 DataWorks 搭建离线数仓，日均调度 XX 个任务'——直接对标企业需求"
  ],
  pit:"别把所有时间花在云上——云只是环境，SQL/建模/调优才是能力本体。先本地把数仓做通，再花 2-3 天迁移到云上，事半功倍。",

/* res 内文关键词自动挂链接（每类资源只链第一处） */
function linkify(t){
  const dict = [
    [/牛客/, "https://www.nowcoder.com/", "牛客"],
    [/LeetCode|力扣/, "https://leetcode.cn/problemset/", "LeetCode"],
    [/W3School/, "https://www.w3school.com.cn/sql/", "W3School"],
    [/Spark\s?SQL|PySpark|Spark/, "https://spark.apache.org/docs/latest/", "Spark 官方文档"],
    [/Hive/, "https://cwiki.apache.org/confluence/display/Hive/LanguageManual", "Hive 语言手册"],
    [/Kafka/, "https://kafka.apache.org/documentation/", "Kafka 官方文档"],
    [/Flink/, "https://nightlies.apache.org/flink/flink-docs-stable/", "Flink 官方文档"],
    [/Hadoop/, "https://hadoop.apache.org/docs/stable/", "Hadoop 官方文档"],
    [/Airflow/, "https://airflow.apache.org/docs/", "Airflow 官方文档"],
    [/DolphinScheduler/, "https://dolphinscheduler.apache.org/zh-cn/", "DolphinScheduler 文档"],
    [/Docker/, "https://docs.docker.com/get-started/", "Docker 入门"],
    [/MySQL/, "https://dev.mysql.com/doc/", "MySQL 文档"],
    [/PostgreSQL/, "https://www.postgresql.org/docs/", "PostgreSQL 文档"],
    [/LangChain/, "https://python.langchain.com/", "LangChain 文档"],
    [/尚硅谷/, "https://search.bilibili.com/all?keyword=%E5%B0%9A%E7%A1%85%E8%B0%B7", "尚硅谷 B 站课程"]
  ];
  const used = {};
  let out = String(t);
  dict.forEach(([re, url, label])=>{
    if(used[url]) return;
    out = out.replace(re, m=>{
      if(used[url]) return m;
      used[url] = 1;
      return `<a class="res-link" href="${url}" target="_blank" rel="noopener" title="${label}">${m}</a>`;
    });
  });
  return out;
}

/* 15 分钟低动力模式（v5.7） */
function lowMode(){
  const cur = TASK_IDS.find(x=>!taskDone(x)) || TASK_IDS[TASK_IDS.length-1];
  const st = STAGES.find(s=>s.id===cur.split("_")[0]);
  const tk = st ? st.tasks[+cur.split("_")[1]] : null;
  const pool = [];
  (TERMS[cur]||[]).forEach(t=>pool.push(["📖 名词快闪", esc(t[0]), t[2]?`💡 ${t[2]}`:"", "把这个词用自己的话讲一遍，讲不顺就再读一遍类比"]));
  ((DETAILS[cur] && DETAILS[cur].quiz)||[]).forEach((q,i)=>pool.push(["✏️ 一题自测", esc(q), (DETAILS[cur].ans||[])[i]||"", "先自己想 1 分钟再点开答案；答不上就在详情页记入错题本"]));
  const pick = pool.length ? pool[Math.floor(Math.random()*pool.length)] : ["🎯 最低动作", "打开当前任务的详解读一遍 intro", "", "只读不改，读完就算赢"];
  $("#mTag").textContent = "15 分钟低动力模式";

    <div class="help-card" style="border-color:var(--accent);background:var(--accent-soft)">

      <div style="margin-top:8px;font-size:12.5px;color:var(--ink-3)">${pick[3]}</div>
    </div>
    <div class="low-actions">

      <button class="btn ghost" id="lowCheckin">✔ 做完就打卡（今天 1 分钟也算连续）</button>

  pit:"最大的误解：'索引越多越好'。每个索引都是写放大——插入/更新要同步维护索引树，索引过多拖慢写入。一般单表 4-5 个索引够用，按实际查询模式建。",
  quiz:["为什么 WHERE YEAR(create_time)=2026 会让索引失效？怎么改？","什么情况下回表？覆盖索引怎么理解？","MySQL 默认隔离级别是什么？如何避免幻读？"], ans:["因为<b>对索引列套了函数</b>，B+ 树无法利用索引的有序性定位（必须先算出每行的函数值再比较）。改成范围查询：WHERE create_time >= '2026-01-01' AND create_time < '2027-01-01'。原则：索引列要'裸着'出现在比较符一侧。","查询的列不在索引里时，通过二级索引找到主键后，<b>再回到聚簇索引取完整行</b>就是回表。覆盖索引=查询的列全部包含在索引里（如联合索引 (a,b) 查询只取 a,b），直接返回索引数据，避免回表，性能提升明显。","REPEATABLE READ（可重复读），靠 MVCC 快照解决普通读的幻读；但<b>当前读（SELECT ... FOR UPDATE / 加锁读）仍可能幻读</b>，InnoDB 用间隙锁/next-key 锁解决。面试答出'快照读靠 MVCC、当前读靠间隙锁'就是满分。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>RR 和 RC 有什么区别，生产上为什么常用 RC？（答：RC 每次读最新已提交版本，锁更少并发更高；RR 同一事务内多次读结果一致）</div>"],
  res:"《MySQL 45 讲》（丁奇，极客时间）前 20 讲 + B 站尚硅谷 MySQL 进阶 + MySQL 官方文档",
  deep:{ go:"<b>深入目标：能从原理层面讲清'慢 SQL 为什么慢'</b>。索引结构、事务隔离、锁机制三块能画出原理图。<b>深入标志：拿到一条慢 SQL 能独立 EXPLAIN 定位问题并给出优化方案。</b>", tasks:["建 100 万行测试表，实测：无索引 vs 有索引查询耗时对比","用 EXPLAIN 分析 5 条慢 SQL，记录 type/rows/Extra 的变化","模拟一个死锁场景（两个事务交叉加锁），观察并复现","给同学讲一遍 B+ 树 vs 哈希索引的适用场景，讲不清重看"] }
},
"s4_2":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>S1 阶段（尤其 s1_2 PySpark ETL）</b> 再学 Kafka——消息队列是数仓/实时链路的基础设施，需要先懂数据链路。</span>Kafka 是大数据生态的'血管'——日志采集、数仓同步、实时计算全依赖它。面试几乎必问，工作天天用。目标：理解分区/副本/消费组三大机制，能讲清'消息不丢不重'的完整方案。",
  pts:[
    "<b>三大组件</b>：Producer（生产消息）、Broker（Kafka 服务器集群，存消息）、Consumer（消费消息）。Topic 是逻辑分类，Partition 是物理分片",
    "<b>分区与有序</b>：同 key 消息哈希进同一分区 → 分区内有序；分区内单消费者顺序消费。想全局有序=单分区单消费者（牺牲并行）",
    "<b>副本与高可用</b>：每个分区 N 个副本，leader 读写、follower 同步；leader 挂了 ISR（同步副本集合）里选新 leader。ack=all 等所有副本确认才算成功",
    "<b>消费组负载均衡</b>：一个分区同时只被组内一个消费者消费；组内消费者增减会触发 rebalance 重分配。想要广播（所有消费者都收到）=不同消费组",
    "<b>offset 与精确一次</b>：消费者把 offset 存 Kafka（内部 topic __consumer_offsets）；不丢不重方案=生产者重试+消费者幂等（或事务性 producer + 读已提交）",
    "<b>常见面试题</b>：消息积压怎么办（加消费者/分区、临时扩容）；顺序性怎么保证；为什么 Kafka 快（顺序写盘+页缓存+零拷贝）；Kafka 和 RocketMQ 区别"
  ],
  pit:"最大的坑：把 Kafka 当数据库用，长期保留所有消息。Kafka 不是消息存储系统，默认保留 7 天（log.retention.hours），数据消费完或过期会被清理。需要长期存储要落库/落数仓。",
  quiz:["消息积压了几百万条，怎么快速处理？","如何保证同一用户的消息严格有序？","Kafka 为什么快？（至少 3 个原因）"], ans:["三板斧：① <b>加消费者</b>（消费组内增加实例，分区数要足够）② <b>临时扩容分区</b>（改 topic 分区数，注意 key 路由会变）③ 如果是下游处理慢，先排查下游（DB 连接池/慢查询），必要时先落表再异步处理。<b>积压的根因通常是下游消费能力不足</b>，不是 Kafka 本身。","方案：<b>同 key 进同分区 + 分区内单消费者</b>——生产者按用户 id 做 key 哈希（partitioner 保证同 key 进同分区），分区内消息按序存储，且同一分区只被组内一个消费者消费，天然有序。代价：一个用户的流量只能一个消费者处理。","① <b>顺序写磁盘</b>：日志追加写，不随机 IO ② <b>页缓存</b>：利用 OS page cache，读写大多走内存 ③ <b>零拷贝</b>：sendfile 直接从磁盘到网卡，减少用户态拷贝 ④ <b>批量压缩</b>：批量发送+压缩减少网络 IO。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>ack 机制有哪些级别，分别什么含义？（答：0 不等确认可能丢；1 leader 写成功即返回，leader 挂会丢；all/-1 等 ISR 全部同步，最稳但最慢）</div>"],
  res:"Kafka 官方文档（入门必读）+ B 站尚硅谷 Kafka 教程 + 《Kafka 权威指南》选读",
  deep:{ go:"<b>深入目标：独立搭建并讲清一个 Kafka 链路</b>。能本地起集群、写生产者消费者、讲清不丢不重。<b>深入标志：能画出'数据从 MySQL → Canal → Kafka → 消费入数仓'的架构图并解释每一环。</b>", tasks:["本地起 Kafka 单机，用命令行创建 topic、生产消费消息","写 Java/Python 生产者消费者，验证 ack=all + 幂等配置","模拟 leader 挂掉，观察分区怎么恢复（ISR 机制）","把 Kafka 接入你的数仓项目：Canal 同步 MySQL binlog 到 Kafka，消费写入 DWD"] }
},
"s4_3":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_2 PySpark ETL 和 s4_2 Kafka</b> 再学 Flink——实时计算是离线知识的延伸，跳过会断层。</span>现在公司主流架构是'离线+实时'双链路：离线 T+1 出报表，实时分钟级出监控/风控/推荐。Flink 是实时计算的绝对主流，校招加分项。目标：先建立流处理思维，再动手跑通一个实时任务。",
  pts:[
    "<b>流 vs 批</b>：批=攒够一批再算（Hive/Spark SQL），流=来一条算一条（Flink/Spark Streaming）。Flink 的'流批一体'指同一套 API 既能跑批也能跑流",
    "<b>时间三兄弟</b>：事件时间（数据真实发生时间，最可靠）、处理时间（到达系统时间）、摄入时间。乱序数据必须用事件时间+水位线处理",
    "<b>水位线 Watermark</b>：声明'事件时间 ≤ watermark 的数据已到齐'。watermark = 观察到的最大事件时间 - 允许乱序延迟。窗口在 watermark 越过窗口结束时间时触发计算",
    "<b>窗口类型</b>：Tumbling（滚动，固定大小不重叠）、Sliding（滑动，有重叠）、Session（会话，超时断开）、Global。按时间或计数（CountWindow）",
    "<b>状态与容错</b>：Flink 有状态计算（累加器/去重集合），状态存内存或 RocksDB；Checkpoint 周期性快照状态+offset，故障从检查点恢复实现 Exactly-Once",
    "<b>背压</b>：下游慢 → 上游自动减速（Flink 有天然背压机制，不会压崩下游）。排查背压看 TaskManager 的 busy 比例和 buffer 使用率"
  ],
  pit:"最大的坑：用处理时间做聚合。数据迟到了 10 分钟，按处理时间算就把 10 点 05 分的数据算进了 10 点 15 分的窗口，报表全错。生产环境一律用事件时间+水位线，除非场景明确允许处理时间。",
  quiz:["水位线怎么理解？乱序数据为什么需要它？","滚动窗口和滑动窗口区别？各举一个场景","Flink 的 Exactly-Once 是怎么保证的？"], ans:["水位线 = <b>'数据截止线'</b>：告诉 Flink'事件时间小于等于这条线的数据我已经基本收齐了，可以触发窗口计算'。乱序数据（网络延迟/重试导致先产生的数据后到）如果不设水位线，窗口要等所有数据到齐才能算，但永远不知道何时到齐——水位线就是'等多久'的策略（通常 = 最大事件时间 - 允许延迟）。","滚动窗口：<b>固定大小、不重叠</b>，如每 5 分钟统计一次交易额（每笔交易只属于一个窗口），适合定时统计。滑动窗口：<b>固定大小 + 滑动步长、有重叠</b>，如每 5 分钟看最近 1 小时的活跃用户（一条数据属于多个窗口），适合实时监控趋势。","<b>Checkpoint + 两阶段提交（2PC）</b>：周期性向数据流注入 barrier，算子收到后把状态异步快照到可靠存储；故障恢复从最近完成的 checkpoint 恢复状态与 Kafka offset；写入外部系统（如 Kafka sink）用 2PC 保证'状态和数据源/目标'原子提交。<b>前提：source 可重放（Kafka 满足）、sink 支持事务或幂等</b>。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>事件时间和处理时间各有什么优缺点？（答：事件时间准确但需要处理乱序和延迟，处理时间简单实时但结果不稳定）</div>"],
  res:"Flink 官方文档（先看概念部分）+ B 站尚硅谷 Flink 教程 + 极客时间《Flink 核心技术与实战》",
  deep:{ go:"<b>深入目标：跑通一条实时链路并讲清原理</b>。Kafka 数据源 → Flink 窗口聚合 → 结果写入，全程理解水位线/状态/容错。<b>深入标志：能独立实现'实时订单金额 1 分钟窗口统计'并解释 watermark 设置依据。</b>", tasks:["本地起 Flink（standalone 模式），跑通官方 WordCount","用 Flink 读 Kafka 模拟订单流，做 1 分钟滚动窗口聚合写回 Kafka/MySQL","人为制造乱序数据（延迟发送），对比有无水位线的结果差异","把实时链路写进简历项目：架构图 + 指标 + 容错方案"] }
},
"s4_4":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s1_6 项目 1</b> 再做可视化——没有自己的数据，学完工具也无从练手。</span>可视化是把数据'讲出来'的能力。面试官不指望你精通 Tableau，但希望你能把项目结果画成图——简历里的项目截图、答辩 PPT、业务周报全靠它。三选一：Power BI（微软，企业用最多）/ 帆软 FineBI（国内主流）/ Tableau（国际大厂偏好）。",
  pts:[
    "<b>图表选型</b>：趋势用折线、对比用柱状/条形、占比用饼图/环形（≤5 类）、分布用直方图/箱线图、关系用散点/热力图、地理用地图。别用饼图装 20 个分类",
    "<b>看板设计原则</b>：从上到下按'核心指标 → 维度拆解 → 明细'布局；重点指标放大+变色；一屏一个主题；手机端优先（现在领导都看手机）",
    "<b>Power BI 核心</b>：Power Query 做清洗（合并/拆分/填充）、数据模型（星型模型：事实表+维度表）、DAX 写度量值（SUMX/CALCULATE/FILTER）、发布到工作区分享",
    "<b>指标口径统一</b>：所有图表的分子分母、去重逻辑必须一致，否则两张图对不上，可信度崩塌——这是业务方最敏感的",
    "<b>讲故事的顺序</b>：先说结论（这个数涨/跌了）→ 再看维度（哪个渠道/地区导致的）→ 最后给行动建议。图表是论据不是主角",
    "<b>简历用法</b>：项目截图放 1-2 张高质量看板图（带数据、带结论标注），比文字描述有说服力得多"
  ],
  pit:"最大的坑：为了炫技做'信息轰炸'——一张图塞 20 个指标、彩虹色、3D 效果。数据可视化的第一原则是'让观众 3 秒看懂'，花哨就是减分。",
  quiz:["给你的数仓项目做一个'业务监控看板'，你会放哪些指标？","饼图和环形图什么时候用？什么时候坚决不用？","Power BI 里 CALCULATE 和 FILTER 分别怎么用？"], ans:["合格答案：<b>分层设计</b>——顶层 3-5 个核心指标（GMV/订单量/UV/转化率/留存），中间按维度拆解（渠道/地区/品类），底部明细表+异常预警（同比环比变色）。每个指标标注口径和更新频率。<b>重点：指标要能和数仓 DWS 层对应上</b>，展示数据链路能力。","占比且分类 ≤5 个时用；分类多、要精确比较大小、要展示趋势时坚决不用。<b>饼图适合'看谁是大头'，柱状图适合'精确对比'</b>。两个饼图并列比大小是新手最常犯的错——人眼对角度不敏感。","CALCULATE 是<b>修改筛选上下文</b>再计算（如 CALCULATE(SUM(销售额), '渠道'='线上')）；FILTER 是返回一个表的筛选函数（通常嵌套在 CALCULATE 里用）。核心区别：CALCULATE 会改变计算上下文，FILTER 只是生成过滤后的表。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>行上下文和筛选上下文区别？（答：行上下文=当前行，在计算列/迭代函数里；筛选上下文=外部筛选条件，CALCULATE 能改写它）</div>"],
  res:"Power BI 官方入门教程（微软 Learn）+ B 站'Power BI 数据分析'系列 + 帆软学院（FineBI 免费课程）",
  deep:{ go:"<b>深入目标：做出一张能放进简历的业务看板</b>。用真实数据（项目 1 的数仓结果）做一张交互式看板。<b>深入标志：看板能回答'业务上周怎么样、为什么、怎么办'三连问。</b>", tasks:["选一个工具装好，用项目 1 的 ADS 层数据导入","按'核心指标→维度拆解→明细'三层布局做一张看板","加 3 个交互：日期筛选、维度切片、钻取下钻","截图存简历 + 写 200 字说明（数据源/口径/结论）"] }
},
"s4_5":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s0_4 Python + s0_5 pandas</b> 再学机器学习——sklearn 需要会操作数据。</span>数据岗越来越强调'懂模型'：数据分析师要会用 sklearn 做预测，AI 数据工程师要懂评估数据质量。不用成为算法工程师，但回归/分类/聚类三件套 + 评估指标必须会讲会用。",
  pts:[
    "<b>监督 vs 无监督</b>：有标签→监督（回归预测数值/分类预测类别）；无标签→无监督（聚类分组）。数据岗最常见：预测销量（回归）、用户分群（聚类）",
    "<b>建模五步</b>：数据清洗 → 特征工程 → 划分训练/测试集（7:3 或 8:2，别忘了随机种子）→ 训练模型 → 评估。sklearn 一行代码训练，重点在前后两步",
    "<b>评估指标</b>：分类看准确率（不准时别用，样本不平衡看精确率/召回率/F1）、回归看 RMSE/MAE、排序看 AUC；聚类看轮廓系数",
    "<b>过拟合三招</b>：更多数据（治本）、正则化（L1/L2）、简化模型（降维/减少特征）。判断方法：训练集好测试集差=过拟合",
    "<b>特征工程优先级</b>：缺失值处理（均值/中位数/删除）→ 类别编码（one-hot/标签）→ 数值归一化（树模型可不做）→ 构造新特征（时间/组合/统计特征）。特征质量决定模型上限",
    "<b>面试常问</b>：线性回归和逻辑回归区别（逻辑回归是分类）、树模型（决策树/随机森林/XGBoost）和线性模型的取舍、为什么树模型不用归一化"
  ],
  pit:"最大的坑：数据泄漏——把测试集信息混进训练（比如先对整个数据集做归一化/填充再划分）。测试集必须'完全没见过'训练过程，否则评估结果虚高，上线就现原形。",
  quiz:["为什么样本不平衡时不能只看准确率？","什么是数据泄漏？举个具体例子","随机森林和 XGBoost 有什么主要区别？"], ans:["样本 99:1 时，模型全预测多数类准确率也有 99%，但少数类（如欺诈）一个都抓不到。<b>应该看精确率（抓到的有多少是对的）、召回率（该抓的抓到多少）、F1（两者调和平均）</b>，必要时用 PR 曲线/AUC。","把<b>测试集的信息提前泄露给训练过程</b>。例：对全量数据做归一化（用了测试集的均值方差）再划分、用测试集做特征选择、时间序列里用未来数据预测过去——评估结果虚高，上线后真实表现差很多。<b>正确姿势：先划分再处理，且所有统计量只用训练集计算</b>。","两者都是树模型集成：随机森林是<b>Bagging</b>（并行训练多棵独立树投票）；XGBoost 是<b>Boosting</b>（串行，每棵树拟合前一棵的残差）。XGBoost 有正则化防过拟合、支持自定义损失、能处理缺失值，通常效果更好但更慢。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>训练集和测试集划分要注意什么？（答：随机划分前打乱；分类任务按类别分层采样；时间序列不能随机划分，要按时间切）</div>"],
  res:"B 站'菜菜的机器学习'（sklearn 入门极好）+ sklearn 官方文档 + 吴恩达机器学习（选看）",
  deep:{ go:"<b>深入目标：用 sklearn 完整跑通一个预测项目</b>。从数据到评估指标全流程，能讲清每一步为什么。<b>深入标志：能独立完成'销量预测'或'用户流失预测'小项目，并解释特征重要性。</b>", tasks:["用项目 0 的数据做一次聚类（KMeans）用户分群，画轮廓系数曲线","完成一个分类小项目（如泰坦尼克生存预测），比较 3 个模型效果","用 10 折交叉验证替代单次划分，对比评估结果","把'特征工程→建模→评估'流程写成文档，标注每步的理由"] }
},
"s4_6":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>🔗 建议先完成：<b>s0_9 统计学</b> 再学本任务——AB 测试是假设检验的应用，统计概念要先有。</span>平台在 S0 统计部分讲了 AB 实验思想，这里补成完整方法论：AA 测试、显著性、样本量、实验陷阱。这是数据分析/商业分析岗的高频面试题，也是工作中最常被问'这个实验怎么设计'的场景。",
  pts:[
    "<b>实验五步</b>：定义假设（H0/H1）→ 确定指标（主指标+护栏指标）→ 算样本量 → 随机分流 → 跑够时间后分析。护栏指标（如延迟、崩溃率）防止实验伤害其他方面",
    "<b>AA 测试</b>：正式实验前跑两个相同版本，验证分流均匀、统计口径正确。AA 显著=分流系统有问题，实验结论不可信",
    "<b>样本量公式直觉</b>：样本量 ∝ 基线转化率的方差 / MDE²。想检测更小的效果（MDE 小）、或基线波动大，都需要更多样本。上线前算好，别跑一半发现不够",
    "<b>显著性解读</b>：p < 0.05 表示'如果真没效果，观测到这么大差异的概率 < 5%'。p 值不是'实验有效的概率'，也不是效果大小。同时看置信区间（比 p 值信息量大）",
    "<b>实验时长</b>：至少覆盖一个完整业务周期（如电商至少一周含周末）；避免节假日/大促期间做实验（流量异常）；不能提前看结果拍脑袋停止",
    "<b>常见陷阱</b>：辛普森悖论（分维度看和总体看结论相反）、样本量不足、多重比较（看 20 个指标总有 1 个显著）、幸存者偏差、实验组相互污染（同一用户同时参与多个实验）"
  ],
  pit:"最大的坑：实验跑了一半就'看起来有效'提前停止。显著性会随样本量增加而波动，提前停止 = 把随机波动当结论。规矩：样本量算好、跑满时长、一次只做一次分析。",
  quiz:["设计一个实验：新首页是否提升转化率。你会怎么设计？","AA 测试的目的是什么？AA 显著说明什么？","p=0.03 的正确解读是什么？"], ans:["完整答案：① 假设：H0=新版与旧版转化率无差异 ② 主指标=支付转化率，护栏指标=人均停留时长/崩溃率 ③ 用基线转化率和 MDE 算样本量 ④ 随机分流（同一用户只进一组，避免交叉污染）⑤ 跑满一个业务周期（至少 7 天含周末）⑥ 分析：p 值和置信区间 + 分维度看（渠道/新老客）确认结论一致。<b>答出'护栏指标'和'跑满周期'是加分项</b>。","AA 测试验证<b>分流系统本身是否公平</b>：两个相同版本跑同样流量，理论上无差异。如果 AA 显著差异，说明分流不均匀（如按用户特征分层失败）、或统计口径/埋点有 bug——此时 AB 结果不可信，先修系统。<b>AA 不显著是 AB 可信的前提</b>。","最严谨的解读：<b>在原假设成立的前提下，观测到当前或更极端结果的概率为 3%</b>。p 值不是'实验有效的概率'（那是贝叶斯思维）、不是'原假设为真的概率'、不代表效应量大小。0.05 只是约定俗成的阈值，p=0.049 和 p=0.051 差异没那么大，结合置信区间和业务意义判断。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>辛普森悖论怎么防？（答：实验前定好主要分析维度，避免事后拆维度挑结论；拆分时确认各维度样本分布是否一致）</div>"],
  res:"B 站'AB 测试'系统教程 + 《实验驱动的产品优化》选读 + 增长黑客案例",
  deep:{ go:"<b>深入目标：具备独立设计实验的能力</b>。从假设到分析完整走一遍，能识别常见陷阱。<b>深入标志：面试问'这个功能怎么验证效果'能 2 分钟给出完整实验方案。</b>", tasks:["用 Python 模拟一次 AB 实验（随机分组 + t 检验），跑通全流程","设计'新推荐算法是否提升点击率'实验，写出完整方案（指标/样本量/时长）","找一个辛普森悖论真实案例，拆解原因并给出正确结论","把实验方法论写成文档，收录进求职作品集"] }
},
"s4_7":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>✅ 零基础可直接学：本任务不需要编程基础，读完即可建立行业业务认知。</span>业务知识是数据岗的'软门槛'：技术面过了，业务面聊行业、聊指标、聊'你怎么看这个数'。校招不要求你懂很深，但电商/广告/金融三大行业的核心指标和玩法必须能聊。目标：每个行业 10 分钟能讲清'这个行业靠什么赚钱、核心指标有哪些、数据人做什么'。",
  pts:[
    "<b>电商</b>：北极星指标=GMV 或订单量。核心漏斗：曝光→点击→加购→下单→支付。关键指标：转化率/客单价/复购率/退货率/LTV/CAC。玩法：大促（双11）、满减、会员体系",
    "<b>广告</b>：收入模型=CPM/CPC/CPA。平台方指标：广告收入、eCPM（千次曝光收入）、填充率；广告主指标：ROI/ROAS、点击率。玩法：竞价排名、定向投放、归因（最后点击/多触点）",
    "<b>金融（信贷）</b>：风险指标：不良率（NPL）、逾期率、通过率、坏账率；经营指标：放款额、余额、息差。玩法：风控模型（反欺诈/信用评分）、额度定价",
    "<b>业务分析框架</b>：异动归因（先验数再归因：数据口径问题→维度拆解→外部因素→结论）、漏斗分析（找流失环节）、留存分析（看产品粘性）、同期群分析（Cohort）",
    "<b>面试业务题套路</b>：DAU 下降 20% 怎么排查？→ 先确认口径/埋点 → 按渠道/新老/地区拆 → 找外部因素（节假日/竞品/舆情）→ 给结论和下一步。答出'先验数'顺序最重要",
    "<b>怎么积累</b>：实习、看行业报告（艾瑞/QuestMobile）、拆解一个 App（它的核心指标是什么）、面试前看目标公司财报/公开课"
  ],
  pit:"最大的坑：只会背指标定义，不会用。面试问'GMV 下降怎么分析'，你答'GMV 是成交总额'——定义谁都知道，要的是分析框架和排查思路。",
  quiz:["DAU 环比下降 20%，你怎么排查原因？","电商 GMV 增长，有哪些可能的拆解角度？","'用户数'这个指标为什么不能说清楚？"], ans:["框架：① <b>先验数</b>——确认不是埋点/口径变更/数据延迟（最大假象来源）② <b>看结构</b>——按渠道/新老用户/地区/版本拆，找异动源 ③ <b>找外部因素</b>——节假日、竞品活动、舆情、政策 ④ <b>对比基线</b>——去年同期、前一周同期 ⑤ <b>结论与建议</b>——各因素贡献度 + 下一步验证动作。<b>答出'先验数再归因'的顺序是得分关键</b>。","GMV = 流量 × 转化率 × 客单价 = UV × 购买转化率 × 客单价。拆解：① 流量涨跌（渠道/活动）② 转化率（页面/价格/竞品）③ 客单价（品类结构/满减）。再往下：新客 vs 老客贡献、各品类贡献。<b>能拆到'哪个环节哪个维度贡献了多少'才算合格</b>。","因为没讲<b>口径</b>。要说清三件事：<b>定义</b>（活跃=打开还是登录？去重吗？）、<b>维度</b>（全站/新老/渠道）、<b>周期</b>（日/周/月）。面试加分：主动反问'您指的是哪个口径'，说明你有业务敏感度。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>留存率下降该怎么分析？（答：同期群分析看是新用户留不住还是老用户流失；再看功能/版本/竞品变化）</div>"],
  res:"艾瑞/QuestMobile 行业报告 + 36氪/人人都是产品经理 + 牛客面经（业务题专区）",
  deep:{ go:"<b>深入目标：能对目标行业聊 10 分钟业务</b>。选 1-2 个行业深耕：核心指标、商业模式、数据岗做什么。<b>深入标志：面试业务题能 2 分钟给出分析框架，不再只背定义。</b>", tasks:["选一个行业（电商/广告/金融），写出它的商业模式+核心指标体系（至少 15 个指标）","拆解一个你常用的 App：它的北极星指标是什么？为什么？","找 3 个业务面试题，每个写出完整分析框架（先验数→拆解→归因→结论）","把行业笔记整理成'行业分析一页纸'放进求职作品集"] }
},
"s4_8":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>✅ 零基础可直接学：本任务以概念和法规为主，不需要编程基础。</span>国家把数据定位为新型生产要素，数据安全与合规成为所有公司的刚需——也成了数据岗的新兴差异化方向。目标：懂基本概念（脱敏/分级/隐私计算），知道工作中哪些红线不能碰，面试能聊出'合规意识'。",
  pts:[
    "<b>为什么重要</b>：个保法/数安法/数据二十条落地，违规最高罚 5000 万或上年营收 5%。企业都缺'懂数据又懂合规'的人，这是增量岗位",
    "<b>数据分级分类</b>：公开/内部/敏感/机密四级（或按业务自定）。敏感数据（个人信息、经营数据）加密存储+访问审批+操作审计",
    "<b>脱敏三原则</b>：可用但不可反推（手机号中间四位打星）、保留业务所需精度（地域统计到省）、脱敏规则可配置可审计",
    "<b>隐私计算</b>：联邦学习（数据不动模型动）、多方安全计算（MPC，密文计算）、可信执行环境（TEE）。实现'数据可用不可见'",
    "<b>数据要素市场</b>：数据资产入表（2024 年起企业可把数据计入资产负债表）、数据交易所（北上广深已建）。懂'数据怎么估值/怎么交易'是前沿话题",
    "<b>数据人的合规红线</b>：未经授权导出敏感数据、把生产数据当测试数据、外发含个人信息的文件不加脱敏——工作中一票否决的错"
  ],
  pit:"最大的坑：把'合规'当口号。真实工作里最常见的违规：测试环境直接复制生产库（含真实手机号）、给外部同学发'脱敏前'的数据、离职时带走数据。合规意识是习惯不是知识。",
  quiz:["手机号字段应该怎么脱敏？为什么不能直接删掉？","什么是'数据可用不可见'？举例说明","数据资产入表是什么意思？对你有何影响？"], ans:["常见做法：<b>中间四位打星（138****1234）+ 哈希加盐映射</b>（需要精确匹配时用映射表，映射表单独加密管理）。不能直接删：业务仍需联系用户（下单通知/客服/风控），且可能按归属地统计。<b>脱敏目标是可用但不可反推</b>。<div class=\"q-follow\"><b>💬 面试官可能追问：</b>脱敏和加密有什么区别？（答：脱敏=变形后部分信息丢失、目的是降低敏感度；加密=可逆变换、目的是防窃取，解密后是原始数据）</div>","指<b>在不暴露原始数据的前提下完成计算</b>。例：两家银行想联合算'共同客户数'但不能让对方看到自己客户名单——用隐私计算（MPC/联邦学习）只输出'共同客户数'这个结果。数据不出域、计算结果共享。","2024 年起企业可把<b>合规的数据资源确认为无形资产/存货</b>计入资产负债表（财政部《数据资源会计处理暂行规定》）。影响：数据从'成本'变成'资产'，企业愿意为数据质量/治理投入更多——<b>数据治理、数据质量的岗位需求会涨</b>，对你是利好。"],
  res:"《个人信息保护法》《数据安全法》原文（读关键条款）+ 信通院数据要素白皮书 + 中国数据要素市场化配置综合改革白皮书",
  deep:{ go:"<b>深入目标：成为团队里的'合规意识最强的人'</b>。把数据安全概念融入项目：脱敏/分级/审计能落地。<b>深入标志：简历项目里写出'对个人信息做脱敏+分级存储'，面试能讲清设计依据。</b>", tasks:["给项目 1 的数据表做分级分类清单（哪些表含个人信息、定什么级）","用 Python 写一个脱敏函数库（手机号/身份证/地址三种掩码）","读个保法前 30 条，整理 10 条工作中要遵守的红线","把'数据安全设计'写进简历项目亮点（200 字）"] }
},
"s4_9":{
  intro:"<span style='display:block;margin-bottom:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);font-weight:700'>✅ 零基础可直接学：本任务从第一天就可以并行进行，越早形成习惯越好。</span>数据岗 50% 的工作是沟通：跟业务方对齐口径、跟领导汇报进展、跟同事协作排期。技术决定你能不能入行，软技能决定你能走多远。目标：结构化表达 + 向上汇报 + 复盘方法 + 文档写作四件套。",
  pts:[
    "<b>结构化表达（金字塔原理）</b>：结论先行（先说结论再说论据）、以上统下（上层概括下层）、归类分组（MECE 不重不漏）、逻辑递进（时间/结构/程度顺序）。汇报任何事都先讲结论",
    "<b>向上汇报公式</b>：进展（做了什么）+ 数据（量化结果）+ 风险（卡点）+ 请求（需要什么支持）。老板时间少，30 秒讲完重点",
    "<b>周报/日报</b>：不是流水账，是'成果+思考'。格式：本周产出（带数字）→ 遇到的问题（怎么解决的）→ 下周计划。写周报是给老板建立信任的过程",
    "<b>复盘四步</b>：目标回顾（原定目标是什么）→ 结果评估（做到了吗，差距）→ 原因分析（主观/客观）→ 规律沉淀（下次怎么做）。项目结束、面试失败都值得复盘",
    "<b>时间管理</b>：重要紧急四象限（先做重要不紧急）、番茄工作法（25+5 保持专注）、任务清单（每天 3 件最重要的事，完成再谈其他）",
    "<b>文档写作</b>：好文档 = 目的 + 背景 + 操作步骤 + 常见问题。写给三个月后的自己看，能复现才算合格。README/交接文档/数据字典都是你的作品"

"s2_2": `# RAG 最小闭环：切片 → 入库 → 检索 → 拼 prompt → 生成（带溯源）
from sentence_transformers import SentenceTransformer
import chromadb
from openai import OpenAI

model = SentenceTransformer("BAAI/bge-small-zh-v1.5")
col = chromadb.Client().get_or_create_collection("kb")

def build_kb(docs):
    ids  = [f"d{i}" for i in range(len(docs))]
    vecs = model.encode(docs, normalize_embeddings=True)
    col.add(ids=ids, embeddings=vecs.tolist(), documents=docs)

def ask(q, k=3):
    qv  = model.encode([q], normalize_embeddings=True)
    hit = col.query(query_embeddings=qv.tolist(), n_results=k)
    ctx = "\\n\\n".join(hit["documents"][0])        # 只喂 top-k，别把全文塞进去
    prompt = (f"仅依据以下材料回答，材料里没有就回答'我不知道'。\\n\\n"
              f"{ctx}\\n\\n问题：{q}")
    r = OpenAI().chat.completions.create(
        model="gpt-4o-mini", messages=[{"role":"user","content":prompt}])
    return r.choices[0].message.content, hit["ids"][0]   # 答案 + 来源（可溯源）

"s4_0": `# 模板一：双指针（有序数组 / 链表，O(n)）
def two_sum_sorted(nums, target):
    l, r = 0, len(nums) - 1
    while l < r:
        s = nums[l] + nums[r]
        if s == target: return [l, r]
        if s < target: l += 1        # 和小了，左指针右移
        else: r -= 1

# 模板二：滑动窗口（子串 / 子数组，O(n)）
def longest_no_repeat(s):
    seen, l, best = {}, 0, 0
    for r, ch in enumerate(s):
        if ch in seen and seen[ch] >= l:
            l = seen[ch] + 1         # 窗口左边界跳到重复位之后
        seen[ch] = r
        best = max(best, r - l + 1)
    return best

# 模板三：二分（找边界，用左闭右开，循环内不取等）
def lower_bound(nums, target):
    l, r = 0, len(nums)
    while l < r:
        mid = (l + r) // 2
        if nums[mid] < target: l = mid + 1
        else: r = mid
    return l

# 模板四：DP（先定义状态 → 再写转移 → 最后处理边界）
def climb(n):
    dp = [0] * (n + 1)
    dp[0] = dp[1] = 1                # 边界：0 阶也算一种方案（站着不动）
    for i in range(2, n + 1):
        dp[i] = dp[i-1] + dp[i-2]    # 转移：从 i-1 或 i-2 上来
    return dp[n]

import numpy as np, pandas as pd
from openai import OpenAI

# ---------- 1. 切分：按语义边界切，别按固定字数硬切 ----------
def split_doc(text, size=400, overlap=80):
    """重叠切分：overlap 保证跨块的句子不被拦腰截断"""
    chunks, i = [], 0
    while i < len(text):
        chunks.append(text[i:i + size])
        i += size - overlap
    return [c for c in chunks if len(c.strip()) > 30]   # 丢掉碎片，碎片只会污染检索

# ---------- 2. 元数据：AI-Ready 的关键，没有元数据的检索无法过滤 ----------

for doc_id, (title, text, src, date) in enumerate(corpus):
    for idx, c in enumerate(split_doc(text)):
        records.append({"doc_id": doc_id, "chunk_id": f"{doc_id}_{idx}",
                        "text": c, "title": title, "source": src, "date": date})
df = pd.DataFrame(records)
print("切分后", len(df), "块，平均", int(df.text.str.len().mean()), "字")

# ---------- 3. 向量化 + 入库 ----------
client = OpenAI()
def emb(t): return client.embeddings.create(model="text-embedding-3-small", input=t).data[0].embedding
vecs = np.array([emb(t) for t in df.text]).astype("float32")
np.save("vecs.npy", vecs); df.to_parquet("chunks.parquet")

# ---------- 4. 检索（余弦相似度，记得归一化） ----------
def search(q, topk=5, where=None):
    v = np.array(emb(q), dtype="float32"); v /= np.linalg.norm(v)
    norm = vecs / np.linalg.norm(vecs, axis=1, keepdims=True)
    sims = norm @ v
    cand = df if where is None else df[where(df)]       # 元数据过滤：AI-Ready 的分水岭
    idx = np.argsort(-sims)[:topk * 3]
    idx = [i for i in idx if i in cand.index][:topk]    # 先召回再过滤的粗筛写法
    return df.iloc[idx].assign(score=sims[idx])

# ---------- 5. 评估集：没有评估集的 RAG 只是 demo ----------

"s3_1": `## 八股速查卡模板（考前 3 天只看这个，不看书）
> 用法：每张卡 = 一个问题 + 一句结论 + 3 个得分点 + 1 个追问。
> 写卡的规则：**写不出来的卡就是你的漏洞**，回去补，别抄。

### Hadoop
- **Q：HDFS 写入流程？**
  - 结论：客户端切块 → 向 NameNode 申请 → 按副本策略建立 pipeline → 流式写入 → 关闭。
  - 得分点：① 块默认 128MB ② 副本默认 3 份，机架感知（本机架 1 + 跨机架 1 + 同另一机架 1）③ 写入是 pipeline 串行 ack，不是并发各写各的。
  - 追问：一个块写失败怎么办？（pipeline 重建，剔除坏节点，NN 重新选 datanode）

### Hive
- **Q：Hive SQL 转 MR/Tez 的过程？**
  - 结论：Parser 解析 → 语义分析 → 逻辑计划 → 优化器 → 物理计划（MR/Tez/Spark）→ 执行。
  - 得分点：① 谓词下推 ② 列裁剪 ③ map-side 聚合 ④ JOIN 顺序优化（小表在前 / mapjoin）。
  - 追问：count(distinct) 为什么容易倾斜？（所有数据汇聚到一个 reducer；解法：先 group by 去重再 count）

### Spark
- **Q：宽窄依赖 & 为什么要有 Stage？**
  - 结论：窄依赖 = 一个父分区只被一个子分区用（map/filter），不 shuffle；宽依赖 = 一个父分区被多个子分区用（groupByKey/join），要 shuffle。**Stage 按宽依赖切分**，shuffle 是性能分水岭。
  - 得分点：① 血统容错：窄依赖可局部重算，宽依赖要重算整个父 Stage ② 能用 reduceByKey 就别用 groupByKey（前者 map 端预聚合）。
  - 追问：数据倾斜怎么发现和解决？（Spark UI 看 task 输入量长尾；加盐两阶段聚合 / 广播 join / 调 partition 数）

### Flink
- **Q：水位线（Watermark）是什么？**
  - 结论：一条"时间截止线"，告诉系统"事件时间 ≤ T 的数据基本到齐了，可以触发窗口"。
  - 得分点：① 单调递增 vs 允许乱序（BoundedOutOfOrderness）② 迟到数据三处理：丢 / 侧输出流 / allowedLateness ③ 水位线由 source 或 assigner 生成，不是全局时钟。
  - 追问：水位线一直不涨会怎样？（窗口永不触发，状态堆积 → OOM；所以 idle source 要标记 idle）

### 网络 & 操作系统（数据岗也考）
- TCP 三次握手 / 四次挥手 / TIME_WAIT 2MSL
- 进程 vs 线程 vs 协程；上下文切换开销

"s3_2": `## 项目复盘 Q&A 模板（每个项目写 3 页，扛住 15 分钟追问）
> 规则：**每个答案都必须有一个数字**。没有数字的答案 = 没做过的答案。

### 第 1 页：项目是什么
- **Q1：用一句话讲清这个项目？**
  - A：把 XX 业务的原始数据做成 XX 层数仓，支撑 XX 张报表 / XX 个指标，把取数从 X 小时降到 X 分钟。
- **Q2：为什么做这个项目（业务价值）？**
  - A：原来业务方取一次数要找数据同学排期 X 天；建成后自助取数，覆盖 XX 人，周均使用 XX 次。
- **Q3：数据量级？**
  - A：日增 XX 万行（约 XX GB），历史 XX 个月，共 XX TB；跑批耗时 XX 分钟，核心任务 XX 个。

### 第 2 页：你怎么做的（追问重灾区）
- **Q4：分层怎么设计，为什么这么分？**
  - A：ODS 贴源 / DWD 明细清洗 / DWS 轻度汇总 / ADS 应用。举例说明为什么：XX 指标被 3 张报表复用，所以下沉到 DWS，避免重复计算，节省 XX% 计算资源。
- **Q5：遇到最大的技术难点？**
  - A：数据倾斜。现象：XX 任务卡在最后一个 task 30 分钟。定位：Spark UI 发现某 key 数据量是中位数 XX 倍。方案：加盐两阶段聚合 / 广播 join。结果：XX 分钟 → XX 分钟。
- **Q6：数据质量怎么保证？**
  - A：三层校验——入口（行数波动 ±30% 告警）、过程（主键唯一 / 非空校验）、出口（和业务方对数，差异 < 0.1%）。

### 第 3 页：如果重来 & 反问
- **Q7：这个项目哪里做得不好？**
  - A：早期没建血缘，改字段要全局搜索；后来补了元数据管理。诚实说 + 说明改进 = 加分。
- **Q8：如果数据量再翻 10 倍，你会改什么？**
  - A：换 OLAP 引擎 / 分区粒度细化 / 冷热分层 / 增量合并（这题考你有没有 scale 意识）。
- **Q9：你和业务方怎么对齐口径？**
  - A：先出指标定义文档（口径 + 计算逻辑 + 更新频率）双方签字，再写代码，避免返工。

### 演练方法
1. 录音计时：每题讲 90 秒，超时的答案说明还没想清楚。
2. 找一个同学只做一件事：**不停问"为什么"**，问到你答不上来 —— 那里就是漏洞。
3. 把答不上来的问题补成新的一页，一周后再演练一遍。`,
